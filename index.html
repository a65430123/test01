<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>烈焰英雄傳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&display=swap">
<style>
/* 暗鐵與燙金：黑鐵面板、細金邊、襯線標題 */
*{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark;
  --sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);--st:env(safe-area-inset-top,0px);--sbm:env(safe-area-inset-bottom,0px);
  --iron:#141317;--iron2:#1e1c22;--edge:#5a4a2c;--gold:#d9b25f;--gold2:#f3dca0;--ember:#e0662a;--text:#ece6da;--muted:#9a9488;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"PingFang TC","Microsoft JhengHei","Noto Sans TC","Noto Sans CJK TC",sans-serif}
html,body{width:100%;height:100%;overflow:hidden;background:#0b0a0d;color:var(--text);font-family:var(--sans);
  user-select:none;-webkit-user-select:none;touch-action:none}
canvas#game{position:fixed;inset:0;display:block}
.hidden{display:none!important}
button{font-family:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
#ui{position:fixed;inset:0;pointer-events:none}
.box{background:linear-gradient(180deg,rgba(30,28,34,.92),rgba(14,13,17,.92));border:1px solid var(--edge);border-radius:3px;
  box-shadow:inset 0 0 0 1px rgba(243,220,160,.08),0 6px 18px rgba(0,0,0,.55)}
#status{position:absolute;left:calc(10px + var(--sl));top:calc(10px + var(--st));display:flex;gap:10px;padding:8px 12px 8px 8px;pointer-events:auto}
#portrait{width:60px;height:60px;border-radius:2px;background:radial-gradient(circle at 50% 40%,#3a2e26,#121014);border:1px solid var(--gold)}
#stName{font-family:var(--serif);font-weight:900;font-size:15px;margin-bottom:3px;white-space:nowrap;letter-spacing:1px}
#stName .lv{color:var(--gold);margin-right:6px}
.bar{width:176px;height:11px;background:#08070a;position:relative;overflow:hidden;margin-top:4px;border:1px solid #2e2a24}
.bar .fill{height:100%;transition:width .15s}
.bar span{position:absolute;inset:0;font-size:9.5px;line-height:10px;text-align:center;text-shadow:0 0 2px #000,0 0 2px #000;font-variant-numeric:tabular-nums}
.hp .fill{background:linear-gradient(#e0504a,#7a1612)}
.mp .fill{background:linear-gradient(#4a8ae0,#152e7a)}
.ex .fill{background:linear-gradient(#e8c060,#7a5a12)}
#stGold{font-size:12px;margin-top:5px;color:var(--gold2);font-variant-numeric:tabular-nums}
#stGold b{color:var(--ember);margin-left:10px}
#mapWrap{position:absolute;right:calc(10px + var(--sr));top:calc(10px + var(--st));padding:6px;text-align:center;pointer-events:auto}
#mapName{font-family:var(--serif);font-size:13px;font-weight:900;color:var(--gold2);margin-bottom:5px;letter-spacing:1px}
#mini{display:block;background:#000;border:1px solid #2e2a24}
#quest{position:absolute;right:calc(10px + var(--sr));top:calc(170px + var(--st));width:172px;padding:8px 10px;font-size:12px;line-height:1.55}
#quest .qt{color:var(--gold);font-family:var(--serif);font-weight:900;letter-spacing:1px}
#quest .ok{color:#8ae08a}
#target{position:absolute;left:50%;top:calc(10px + var(--st));transform:translateX(-50%);padding:5px 14px;text-align:center;min-width:220px}
#target .nm{font-family:var(--serif);font-size:13px;font-weight:900}
#target .bar{width:210px}
#log{position:absolute;left:calc(10px + var(--sl));bottom:calc(96px + var(--sbm));width:min(340px,60vw);font-size:12px;line-height:1.55;text-shadow:0 0 3px #000,0 0 3px #000}
#skillbar{position:absolute;left:50%;bottom:calc(12px + var(--sbm));transform:translateX(-50%);display:flex;gap:6px;padding:7px 8px;pointer-events:auto}
.sk{position:relative;width:54px;height:54px;border-radius:2px;border:1px solid #6a5634;background:radial-gradient(circle at 50% 35%,#2e2a30,#121014);
  color:#fff;font-size:23px;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:manipulation;box-shadow:inset 0 0 0 1px rgba(0,0,0,.6)}
.sk:active{transform:scale(.95)}
.sk .key{position:absolute;left:3px;top:1px;font-size:10px;color:var(--gold)}
.sk .cnt{position:absolute;right:3px;bottom:1px;font-size:11px;font-weight:bold;text-shadow:0 0 2px #000}
.sk .cdm{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);pointer-events:none}
.sk .cdt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:bold;text-shadow:0 0 3px #000;pointer-events:none}
.sk.lock{filter:grayscale(1);opacity:.5}
.sk .nm2{position:absolute;bottom:0;left:0;right:0;font-size:9px;text-align:center;color:#cfc8ba;text-shadow:0 0 2px #000}
#side{position:absolute;right:calc(10px + var(--sr));bottom:calc(12px + var(--sbm));display:flex;flex-direction:column;gap:6px;pointer-events:auto}
.sb{width:62px;height:44px;border-radius:2px;border:1px solid var(--edge);background:linear-gradient(#2a2620,#14120f);color:var(--gold2);
  font-family:var(--serif);font-size:13px;font-weight:900;line-height:1.1;letter-spacing:1px;touch-action:manipulation}
.sb small{display:block;font-family:var(--sans);font-size:9px;color:var(--muted);font-weight:normal;letter-spacing:0}
.sb.on{background:linear-gradient(#7a2e12,#3a1206);border-color:var(--ember);color:#fff;box-shadow:0 0 14px rgba(224,102,42,.6)}
#toast{position:absolute;left:50%;top:30%;transform:translateX(-50%);font-family:var(--serif);font-size:28px;font-weight:900;letter-spacing:4px;color:var(--gold2);
  text-shadow:0 0 12px rgba(224,102,42,.8),0 2px 0 #000;pointer-events:none;transition:opacity .4s;opacity:0;white-space:nowrap}
#panel{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(660px,94vw);max-height:86vh;display:flex;flex-direction:column;z-index:10}
#panel .ph{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--edge);
  font-family:var(--serif);font-weight:900;color:var(--gold2);font-size:16px;letter-spacing:2px}
#panel .ph button{background:none;border:none;color:var(--muted);font-size:20px;line-height:1}
#panel .ph button:hover{color:#fff}
#panel .pb{padding:12px 14px;overflow:auto;font-size:13px;line-height:1.6}
.btn{background:linear-gradient(#c89a48,#7a5620);border:1px solid #f3dca0;color:#1a1206;font-weight:bold;border-radius:2px;padding:5px 12px;margin:3px 4px 3px 0;font-size:13px}
.btn.g{background:linear-gradient(#3a7a3a,#1a3e1a);color:#fff;border-color:#8ac88a}
.btn.r{background:linear-gradient(#a8401e,#5a1a0a);color:#fff;border-color:#f0a070}
.btn:disabled{filter:grayscale(1);opacity:.45}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid rgba(217,178,95,.12)}
.bag{display:flex;gap:14px;flex-wrap:wrap}
.eqcol{flex:1 1 210px;min-width:0}
.invcol{flex:2 1 280px;min-width:0}
.heroPrev{display:flex;gap:8px;align-items:flex-end}
.heroPrev canvas{width:110px;height:140px;background:radial-gradient(ellipse at 50% 80%,#2e2620,#0e0d10 70%);border:1px solid #2e2a24}
.eqslots{display:grid;grid-template-columns:repeat(2,44px);gap:5px}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.cell{position:relative;aspect-ratio:1;max-width:100%;border-radius:2px;background:#0e0d10;border:1px solid #2e2a24;display:flex;align-items:center;justify-content:center;font-size:20px}
.cell.sel{outline:2px solid var(--gold2)}
.cell .en{position:absolute;right:2px;top:0;font-size:10px;color:var(--gold2);font-weight:bold}
.cell .up{position:absolute;left:2px;bottom:0;font-size:10px;color:#6f6}
.cell .lab{position:absolute;bottom:1px;font-size:9px;color:#6a6458}
.stats{font-size:12px;display:grid;grid-template-columns:1fr 1fr;gap:2px 10px;background:rgba(0,0,0,.35);padding:6px 8px;margin-top:8px;font-variant-numeric:tabular-nums}
.stats b{color:var(--gold)}
#detail{margin-top:8px;min-height:60px;background:rgba(0,0,0,.35);padding:8px;font-size:12px}
.npcsay{background:rgba(0,0,0,.35);border-left:2px solid var(--gold);padding:8px 10px;margin-bottom:8px;color:#e8dcc4}
#start{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;
  background:radial-gradient(ellipse at 50% 110%,rgba(224,102,42,.35),transparent 55%),radial-gradient(ellipse at 50% 0%,#24202a,#0b0a0d 70%);
  z-index:20;overflow:auto;padding:calc(16px + var(--st)) max(16px,var(--sr)) calc(16px + var(--sbm)) max(16px,var(--sl))}
#start h1{font-family:var(--serif);font-weight:900;font-size:clamp(38px,8vw,68px);letter-spacing:10px;text-indent:10px;
  background:linear-gradient(#fff4d0,#e8b04a 55%,#9a4a12);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 14px rgba(224,102,42,.55)) drop-shadow(0 3px 0 #000)}
#start .sub{color:var(--muted);margin:6px 0 16px;font-size:13px;letter-spacing:4px}
.gender{display:flex;margin-bottom:14px;border:1px solid var(--edge)}
.gender button{background:#141317;color:var(--muted);border:none;padding:8px 26px;font-family:var(--serif);font-weight:900;font-size:15px;letter-spacing:3px}
.gender button.sel{background:linear-gradient(#c89a48,#7a5620);color:#1a1206}
.cards{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.card{width:176px;padding:8px 10px 12px;border:1px solid #2e2a24;background:linear-gradient(180deg,#1a181e,#0e0d10);text-align:center;cursor:pointer;transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-3px)}
.card.sel{border-color:var(--gold);box-shadow:0 0 22px rgba(217,178,95,.35),inset 0 0 0 1px rgba(243,220,160,.15)}
.card canvas{width:130px;height:150px;max-width:100%}
.card h3{font-family:var(--serif);font-weight:900;color:var(--gold2);margin:2px 0 4px;letter-spacing:4px}
.card p{font-size:12px;color:#b4ad9f;line-height:1.5;min-height:36px}
#start input{margin:16px 0 8px;padding:9px 12px;border-radius:2px;border:1px solid var(--edge);background:#0e0d10;color:#fff;font-size:16px;text-align:center;width:220px;font-family:inherit}
#start input:focus{outline:1px solid var(--gold)}
#start .help{margin-top:14px;font-size:12px;color:#7a7468;text-align:center;line-height:1.8;max-width:560px}
#death{position:fixed;inset:0;background:radial-gradient(ellipse,rgba(60,0,0,.5),rgba(0,0,0,.8));display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:15}
#death h2{font-family:var(--serif);font-size:44px;font-weight:900;letter-spacing:8px;color:#d83a2a;text-shadow:0 0 16px #000}
#death p{margin:10px 0 18px;color:#e8dcc4}
@media (prefers-reduced-motion:reduce){.card,.bar .fill,#toast{transition:none}}
@media (max-width:640px){
  .bar{width:120px}
  #quest{top:calc(150px + var(--st));width:140px;font-size:11px}
  #mini{width:120px;height:90px}
  .sk{width:46px;height:46px;font-size:19px}
  #skillbar{gap:4px;padding:5px}
  #log{bottom:calc(80px + var(--sbm));font-size:11px}
  .sb{width:54px;height:40px;font-size:12px}
  #target{top:auto;bottom:calc(84px + var(--sbm))}
  #side{bottom:calc(84px + var(--sbm))}
  .card{width:31%;min-width:104px;padding:6px}
  .card p{display:none}
}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="ui" class="hidden">
  <div id="status" class="box">
    <canvas id="portrait" width="116" height="116"></canvas>
    <div>
      <div id="stName"></div>
      <div class="bar hp"><div class="fill" id="hpF"></div><span id="hpT"></span></div>
      <div class="bar mp"><div class="fill" id="mpF"></div><span id="mpT"></span></div>
      <div class="bar ex"><div class="fill" id="exF"></div><span id="exT"></span></div>
      <div id="stGold"></div>
    </div>
  </div>
  <div id="mapWrap" class="box"><div id="mapName"></div><canvas id="mini" width="150" height="112"></canvas></div>
  <div id="quest" class="box"></div>
  <div id="target" class="box hidden"><div class="nm" id="tgN"></div><div class="bar hp"><div class="fill" id="tgF"></div><span id="tgT"></span></div></div>
  <div id="log"></div>
  <div id="skillbar" class="box"></div>
  <div id="side">
    <button class="sb" id="bAuto">自動<small>Z 掛機</small></button>
    <button class="sb" id="bBag">背包<small>B</small></button>
    <button class="sb" id="bChar">修煉<small>C</small></button>
    <button class="sb" id="bTown">回城<small>T</small></button>
  </div>
  <div id="toast"></div>
</div>

<div id="panel" class="box hidden"><div class="ph"><span id="pTitle"></span><button id="pClose">✕</button></div><div class="pb" id="pBody"></div></div>

<div id="death" class="hidden"><h2>你已陣亡</h2><p id="deathMsg"></p><button class="btn" id="bRevive">回城復活</button></div>

<div id="start">
  <h1>烈焰英雄傳</h1>
  <div class="sub">即時戰鬥 · 打寶升級 · 裝備強化</div>
  <div class="gender" id="gender"><button data-g="male" class="sel">男性角色</button><button data-g="female">女性角色</button></div>
  <div class="cards" id="cards"></div>
  <input id="nameIn" maxlength="8" placeholder="輸入角色名稱">
  <div>
    <button class="btn g" id="bStart" style="font-size:17px;padding:8px 26px">開始冒險</button>
    <button class="btn hidden" id="bCont" style="font-size:17px;padding:8px 26px">繼續遊戲</button>
  </div>
  <div class="help">
    滑鼠點擊 / 手指拖曳 移動　·　點怪物自動攻擊　·　WASD / 方向鍵 也能移動<br>
    1 2 3 施放技能　·　Q 紅藥　E 藍藥　·　Z 自動掛機　·　B 背包　·　C 修煉　·　T 回城<br>
    角色外觀會隨身上的裝備改變　·　進度會自動存在瀏覽器中
  </div>
</div>

<script>
'use strict';
/* ================= 基礎工具 ================= */
const $ = id => document.getElementById(id);
const cv = $('game'), ctx = cv.getContext('2d');
const TILE = 48, INV_MAX = 30, SAVE_KEY = 'qmeng_hero_save_v1';
let W = 0, H = 0, DPR = 1, ZOOM = 1;
function resize(){
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  cv.width = Math.floor(W * DPR); cv.height = Math.floor(H * DPR);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ZOOM = Math.min(W, H) < 560 ? 0.78 : 1;
}
addEventListener('resize', resize); resize();

function mulberry(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const PI2 = Math.PI * 2;
function rr(c, x, y, w, h, r){ c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
function ell(c, x, y, rx, ry){ c.beginPath(); c.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), 0, 0, PI2); }
function shade(hex, amt){
  let n = parseInt(hex.slice(1), 16);
  let r = clamp((n >> 16) + amt, 0, 255), g = clamp((n >> 8 & 255) + amt, 0, 255), b = clamp((n & 255) + amt, 0, 255);
  return '#' + ((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1);
}
function esc(s){ return String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])); }

/* ================= 遊戲資料 ================= */
const CLASSES = {
  sword:  {name:'劍客', desc:'近戰坦克，血厚防高，旋風斬清怪一流', hp:130, mp:30, atk:11, def:5, range:56, cd:0.75,
           g:{hp:24, mp:4, atk:3.2, def:1.6}, look:{body:'#d9534f', hair:'#3b2a1a', acc:'#f0c040', pants:'#4b3a30'}, weapon:'sword', proj:null},
  mage:   {name:'術士', desc:'遠程法術，爆發驚人，流星火雨毀天滅地', hp:75, mp:90, atk:13, def:2, range:240, cd:1.0,
           g:{hp:13, mp:13, atk:3.8, def:0.8}, look:{body:'#5b6ee1', hair:'#f2f0ff', acc:'#ffd76a', pants:'#2f2a55'}, weapon:'staff', proj:'bolt'},
  ranger: {name:'遊俠', desc:'遠程弓手，攻速迅捷，散射箭雨控場', hp:95, mp:50, atk:12, def:3, range:220, cd:0.8,
           g:{hp:17, mp:7, atk:3.4, def:1.1}, look:{body:'#3c9d5d', hair:'#c8742c', acc:'#8b5a2b', pants:'#3d3524'}, weapon:'bow', proj:'arrow'},
};
const SKILLS = {
  sword: [
    {name:'旋風斬', icon:'🌀', lv:1, mp:8, cd:4, type:'aoeSelf', r:95, mult:2.2, fx:'#ffd27a'},
    {name:'衝鋒突刺', icon:'⚡', lv:5, mp:12, cd:7, type:'dash', mult:3.0, stun:1.2, range:300, fx:'#fff2a8'},
    {name:'戰神怒吼', icon:'💢', lv:12, mp:20, cd:25, type:'buff', dur:10, heal:0.25, fx:'#ff7043'},
  ],
  mage: [
    {name:'火球術', icon:'🔥', lv:1, mp:8, cd:1.8, type:'proj', mult:2.4, aoe:55, speed:420, fx:'#ff8a3d', range:300},
    {name:'冰霜新星', icon:'❄️', lv:5, mp:16, cd:6, type:'aoeSelf', r:140, mult:1.8, slow:3, fx:'#8fd8ff'},
    {name:'流星火雨', icon:'☄️', lv:12, mp:32, cd:12, type:'aoeTarget', r:120, mult:1.5, hits:4, fx:'#ff5a1f', range:320},
  ],
  ranger: [
    {name:'穿雲箭', icon:'🏹', lv:1, mp:6, cd:2.2, type:'proj', mult:2.6, pierce:true, speed:640, fx:'#c6ff7a', range:320},
    {name:'扇形散射', icon:'✴️', lv:5, mp:12, cd:5, type:'fan', n:5, mult:1.3, speed:520, fx:'#ffe066', range:280},
    {name:'箭雨', icon:'🌧️', lv:12, mp:26, cd:11, type:'aoeTarget', r:110, mult:1.2, hits:5, fx:'#e0ffb0', range:300},
  ],
};
const MT = {
  slime:    {name:'毒液軟泥', lv:1,  hp:32,   atk:5,  def:0,  exp:8,    gold:[1,4],     spd:45, size:16, h:30,  passive:true, draw:'slime', color:'#5a9a2a'},
  mushroom: {name:'腐菇妖',     lv:3,  hp:60,   atk:8,  def:1,  exp:15,   gold:[2,6],     spd:50, size:16, h:46,  draw:'mushroom', color:'#5a2438'},
  wolf:     {name:'暗影狼',     lv:6,  hp:100,  atk:12, def:3,  exp:28,   gold:[4,10],    spd:85, size:20, h:48,  draw:'wolf', color:'#3e4250'},
  bat:      {name:'洞窟蝙蝠',   lv:10, hp:150,  atk:17, def:4,  exp:45,   gold:[6,14],    spd:95, size:15, h:54,  draw:'bat', color:'#7a4fa0'},

function stats(){
  const C = CLASSES[P.cls], L = P.lv - 1;
  let hp = C.hp + C.g.hp * L, mp = C.mp + C.g.mp * L, atk = C.atk + C.g.atk * L, def = C.def + C.g.def * L, crit = 5, spd = 0;
  for(const k of SLOT_ORDER){
    const it = P.eq[k]; if(!it) continue;
    const m = 1 + it.enh * 0.1;
    hp += it.hp * m; mp += it.mp * m; atk += it.atk * m; def += it.def * m; crit += it.crit; spd += it.spd;
  }
  const A = P.attr || {str:0, vit:0, agi:0, int:0};
  atk += A.str * 0.8 + A.int * 0.25; hp += A.vit * 6; def += A.vit * 0.3; crit += A.agi * 0.25; spd += A.agi * 0.3; mp += A.int * 5;
  if(P.buffT > 0) atk *= 1.5;
  return {maxHp:Math.round(hp), maxMp:Math.round(mp), atk:Math.round(atk), def:Math.round(def), crit:Math.min(60, Math.round(crit)), spd:150 * (1 + spd / 100), spdP:Math.round(spd)};
}
function power(s){ return Math.round(s.atk * 3 + s.def * 4 + s.maxHp / 4 + s.maxMp / 8 + s.crit * 5); }

function genItem(slot, mlv, q, cls){
  const tier = clamp(Math.floor(mlv / 5), 0, 8);
  const pw = (4 + mlv * 1.6) * QM[q];
  const name = slot === 'weapon' ? WNAMES[cls || P.cls][tier] : NAMES[slot][tier];
  const it = {uid:uid(), slot, q, lv:Math.max(1, mlv - 2), enh:0, name, atk:0, def:0, hp:0, mp:0, crit:0, spd:0, cls:slot === 'weapon' ? (cls || P.cls) : null};
  if(slot === 'weapon') it.atk = Math.round(pw);
  if(slot === 'armor'){ it.def = Math.round(pw * 0.5); it.hp = Math.round(pw * 3); }
  if(slot === 'helmet'){ it.def = Math.round(pw * 0.35); it.hp = Math.round(pw * 1.5); }
  if(slot === 'boots'){ it.def = Math.round(pw * 0.25); it.spd = 4 + q * 3; }
  if(slot === 'ring'){ it.atk = Math.round(pw * 0.4); it.crit = 2 + q * 2; }
  for(let i = 1; i < q; i++){
    const r = Math.random();
    if(r < 0.35) it.hp += Math.round(pw * 1.8);
    else if(r < 0.6) it.mp += Math.round(pw * 1.2);
    else if(r < 0.8) it.crit += 1 + q;
    else it.atk += Math.round(pw * 0.25);
  }
  it.tier = tier;
  it.price = Math.round(pw * (q + 1) * 1.5);
  return it;
}
function rollQ(bonus){
  const r = Math.random() - (bonus || 0);
  return r < 0.012 ? 4 : r < 0.06 ? 3 : r < 0.18 ? 2 : r < 0.45 ? 1 : 0;
}
function itemPower(it){ if(!it) return 0; const m = 1 + it.enh * 0.1; return (it.atk * 3 + it.def * 4 + it.hp / 4 + it.mp / 8) * m + it.crit * 5 + it.spd * 3; }
function itemName(it){ return (it.enh ? '+' + it.enh + ' ' : '') + it.name; }
function itemIcon(it){ return it.slot === 'weapon' ? W_ICON[it.cls || P.cls] : SLOT_ICON[it.slot]; }
function itemHTML(it){
  const m = 1 + it.enh * 0.1, L = [];
  if(it.atk) L.push(`攻擊 +${Math.round(it.atk * m)}`);
  if(it.def) L.push(`防禦 +${Math.round(it.def * m)}`);
  if(it.hp) L.push(`生命 +${Math.round(it.hp * m)}`);
  if(it.mp) L.push(`魔力 +${Math.round(it.mp * m)}`);
  if(it.crit) L.push(`暴擊 +${it.crit}%`);
  if(it.spd) L.push(`移速 +${it.spd}%`);
  const wrong = it.slot === 'weapon' && it.cls && it.cls !== P.cls;
  return `<div style="color:${QC[it.q]};font-weight:bold;font-size:14px">${itemIcon(it)} ${esc(itemName(it))}</div>
    <div style="color:#bbb">${SLOTS[it.slot]} · ${QN[it.q]} · <span style="color:${P.lv < it.lv ? '#ff6a6a' : '#bbb'}">需求等級 ${it.lv}</span>${wrong ? ' · <span style="color:#ff6a6a">' + CLASSES[it.cls].name + '專用</span>' : ''}</div>
    <div style="color:#9fe">${L.join('　')}</div><div style="color:#ffd76a">售價 ${it.price} 金幣</div>`;
}
function canEquip(it){ return P.lv >= it.lv && !(it.slot === 'weapon' && it.cls && it.cls !== P.cls); }
function equip(i){
  const it = P.inv[i]; if(!it) return;
  if(!canEquip(it)){ msg('無法裝備：等級或職業不符', '#ff8a8a'); return; }
  const old = P.eq[it.slot]; P.eq[it.slot] = it; P.inv.splice(i, 1);
  if(old) P.inv.push(old);
  msg(`裝備了 ${itemName(it)}`, QC[it.q]); afterEquip();
}
function unequip(slot){
  const it = P.eq[slot]; if(!it) return;
  if(P.inv.length >= INV_MAX){ msg('背包已滿', '#ff8a8a'); return; }
  P.eq[slot] = null; P.inv.push(it); afterEquip();
}
function afterEquip(){ S = stats(); P.hp = Math.min(P.hp, S.maxHp); P.mp = Math.min(P.mp, S.maxMp); save(); }
function autoEquip(){
  let n = 0;
  for(const slot of SLOT_ORDER){
    let bi = -1, bp = itemPower(P.eq[slot]);
    P.inv.forEach((it, i) => { if(it.slot === slot && canEquip(it) && itemPower(it) > bp){ bp = itemPower(it); bi = i; } });
    if(bi >= 0){ const it = P.inv[bi]; const old = P.eq[slot]; P.eq[slot] = it; P.inv.splice(bi, 1); if(old) P.inv.push(old); n++; }
  }
  afterEquip();
  msg(n ? `一鍵換裝完成，更換了 ${n} 件裝備` : '目前已是最佳裝備', '#9fe');
}
function sellItem(i){
  const it = P.inv[i]; if(!it) return;
  P.inv.splice(i, 1); P.gold += it.price; msg(`出售 ${itemName(it)}，獲得 ${it.price} 金幣`, '#ffd76a'); save();
}
function sellBelow(q){
  let g = 0, n = 0;
  P.inv = P.inv.filter(it => { if(it.q <= q && it.enh === 0){ g += it.price; n++; return false; } return true; });
  P.gold += g; msg(n ? `出售 ${n} 件裝備，獲得 ${g} 金幣` : '沒有可出售的裝備', '#ffd76a'); save();
}

/* ================= 地圖生成 ================= */
function hashStr(s){ let h = 2166136261; for(const ch of s){ h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }

function buildMap(id){
  const M = MAPS[id];
  if(M.cache) return M.cache;
  const R = mulberry(hashStr(id) + 7);
  const th = THEMES[M.theme];
  const cw = M.w * TILE, ch = M.h * TILE;
  const g = document.createElement('canvas'); g.width = cw; g.height = ch;
  const c = g.getContext('2d');
  // 基礎地磚
  for(let y = 0; y < M.h; y++) for(let x = 0; x < M.w; x++){
    c.fillStyle = th.ground[Math.floor(R() * th.ground.length)];
    c.fillRect(x * TILE, y * TILE, TILE, TILE);
  }
  // 斑塊
  for(let i = 0; i < M.w * M.h * 0.5; i++){
    c.fillStyle = R() < 0.5 ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.06)';
    ell(c, R() * cw, R() * ch, 20 + R() * 50, 12 + R() * 30); c.fill();
  }
  const dec = [], sol = [];
  const avoid = [];
  for(const p of M.portals) avoid.push({x:p.x * TILE, y:p.y * TILE, r:TILE * 3});
  for(const n of (M.npcs || [])) avoid.push({x:n.x * TILE, y:n.y * TILE, r:TILE * 1.8});
  const free = (x, y, extra) => avoid.every(a => Math.hypot(a.x - x, a.y - y) > a.r + (extra || 0));

  const path = (pts, wdt, col, edge) => {
    c.lineCap = 'round'; c.lineJoin = 'round';
    c.strokeStyle = edge; c.lineWidth = wdt + 8; c.beginPath(); pts.forEach((p, i) => i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1])); c.stroke();
    c.strokeStyle = col; c.lineWidth = wdt; c.stroke();
  };

  if(M.theme === 'village' || M.theme === 'forest'){
    // 小草與花
    for(let i = 0; i < M.w * M.h * 1.2; i++){
      const x = R() * cw, y = R() * ch;
      c.strokeStyle = 'rgba(14,30,10,.45)'; c.lineWidth = 1.4;
      c.beginPath(); c.moveTo(x, y); c.lineTo(x - 2, y - 6); c.moveTo(x, y); c.lineTo(x + 2, y - 7); c.stroke();
    }
    for(let i = 0; i < M.w * M.h * 0.04; i++){
      const x = R() * cw, y = R() * ch, col = ['#c8c0b0','#c8a850','#9a5a6a','#7a8ab0'][Math.floor(R() * 4)];
      c.fillStyle = col; for(let k = 0; k < 5; k++){ c.beginPath(); c.arc(x + Math.cos(k * 1.256) * 3, y + Math.sin(k * 1.256) * 3, 2.2, 0, PI2); c.fill(); }
      c.fillStyle = '#6a5a20'; c.beginPath(); c.arc(x, y, 1.6, 0, PI2); c.fill();
    }
  }
  if(M.theme === 'village'){
    // 石板路與廣場
    const onRoad = (x, y) => Math.abs(y - 12 * TILE) < 34 || (Math.abs(x - 16 * TILE) < 26 && y > 3 * TILE && y < 21 * TILE) || ((x - 16 * TILE) ** 2 / (5 * TILE) ** 2 + (y - 12.3 * TILE) ** 2 / (4 * TILE) ** 2 < 1);
    path([[0, 12 * TILE], [cw, 12 * TILE]], 68, '#3e3830', '#2a2620');
    path([[16 * TILE, 3 * TILE], [16 * TILE, 21 * TILE]], 52, '#3e3830', '#2a2620');
    c.fillStyle = '#2a2620'; ell(c, 16 * TILE, 12.3 * TILE, 5.2 * TILE, 4.2 * TILE); c.fill();
    c.fillStyle = '#3e3830'; ell(c, 16 * TILE, 12.3 * TILE, 5 * TILE, 4 * TILE); c.fill();
    const STONE = ['#77706a', '#6c665e', '#827a70', '#625c55'];
    for(let y = 0; y < ch; y += 9) for(let x = ((y / 9) % 2) * 6; x < cw; x += 12){
      const sx = x + (R() - 0.5) * 3, sy = y + (R() - 0.5) * 2;
      if(!onRoad(sx, sy)) continue;
      c.fillStyle = STONE[Math.floor(R() * 4)]; rr(c, sx - 5, sy - 3.5, 9.5 + R() * 2, 7, 2.2); c.fill();
      c.fillStyle = 'rgba(255,255,255,.06)'; c.fillRect(sx - 4, sy - 3, 7, 1.4);
    }
    c.strokeStyle = 'rgba(200,170,90,.25)'; c.lineWidth = 3; ell(c, 16 * TILE, 12.3 * TILE, 3.2 * TILE, 2.5 * TILE); c.stroke();
    avoid.push({x:16 * TILE, y:12.3 * TILE, r:5.6 * TILE});
    const houses = [[5, 7, '#5a2a24'], [26.5, 7, '#2a3448'], [5, 19.5, '#3a3240'], [26.5, 19.5, '#4a3424'], [11, 4.2, '#2e3a30'], [21, 4.2, '#4a2e2a']];
    for(const [hx, hy, roof] of houses){
      dec.push({t:'house', x:hx * TILE, y:hy * TILE, roof});
      sol.push({x1:hx * TILE - 78, y1:hy * TILE - 56, x2:hx * TILE + 78, y2:hy * TILE + 4});
      avoid.push({x:hx * TILE, y:hy * TILE - 30, r:TILE * 2.8});
    }
    dec.push({t:'well', x:16 * TILE, y:11.4 * TILE});
    for(const [lx, ly] of [[10.6, 9.2], [21.4, 9.2], [10.6, 15.6], [21.4, 15.6], [3, 11], [29, 11], [15, 4], [15, 20.5]]) dec.push({t:'lamp', x:lx * TILE, y:ly * TILE, v:R()});
    sol.push({x1:16 * TILE - 26, y1:11.4 * TILE - 18, x2:16 * TILE + 26, y2:11.4 * TILE + 4});
    for(let x = 0; x < M.w; x++) for(const y of [0.6, M.h - 0.3]){
      if(Math.abs(x - 16) < 2) continue;
      if(R() < 0.75) dec.push({t:'tree', x:(x + 0.5) * TILE + (R() - 0.5) * 16, y:y * TILE, s:0.9 + R() * 0.35, v:R()});
    }
    for(let y = 1; y < M.h; y++) for(const x of [0.5, M.w - 0.5]){
      if(Math.abs(y - 12) < 2) continue;
      if(R() < 0.75) dec.push({t:'tree', x:x * TILE, y:y * TILE + (R() - 0.5) * 16, s:0.9 + R() * 0.35, v:R()});
    }
    for(let i = 0; i < 26; i++){
      const x = (2 + R() * (M.w - 4)) * TILE, y = (2 + R() * (M.h - 4)) * TILE;
      if(Math.abs(y - 12 * TILE) < 60 || Math.abs(x - 16 * TILE) < 50 || !free(x, y, 10)) continue;
      dec.push({t:R() < 0.5 ? 'bush' : 'tree', x, y, s:0.8 + R() * 0.3, v:R()});
    }
    for(let i = 0; i < 8; i++){
      const x = (3 + R() * (M.w - 6)) * TILE, y = (3 + R() * (M.h - 6)) * TILE;
      if(Math.abs(y - 12 * TILE) < 60 || !free(x, y, 30)) continue;
      dec.push({t:'fence', x, y});
    }
  }
  if(M.theme === 'forest'){
    const trail = [];
    for(let x = 0; x <= M.w; x += 1) trail.push([x * TILE, (20 + Math.sin(x * 0.22) * 4 + Math.sin(x * 0.07) * 3) * TILE]);
    path(trail, 56, '#4a3e2c', '#2e2618');
    const onTrail = (x, y) => { const tx = x / TILE; const ty = 20 + Math.sin(tx * 0.22) * 4 + Math.sin(tx * 0.07) * 3; return Math.abs(y / TILE - ty) < 1.6; };
    for(let i = 0; i < 260; i++){
      const edge = R() < 0.45;
      let x, y;
      if(edge){ const side = Math.floor(R() * 4); x = side < 2 ? R() * cw : (side === 2 ? R() * 2 * TILE : cw - R() * 2 * TILE); y = side < 2 ? (side === 0 ? R() * 2 * TILE : ch - R() * 1.5 * TILE) : R() * ch; }
      else { x = R() * cw; y = R() * ch; }
      if(onTrail(x, y) || !free(x, y)) continue;
      const r = R();
      dec.push({t:r < 0.55 ? 'tree' : r < 0.72 ? 'pine' : r < 0.86 ? 'bush' : r < 0.94 ? 'rock' : 'shroom', x, y, s:0.85 + R() * 0.45, v:R()});
    }
  }
  if(M.theme === 'cave'){
    for(let i = 0; i < M.w * M.h * 0.7; i++){
      const x = R() * cw, y = R() * ch;
      c.fillStyle = R() < 0.5 ? 'rgba(90,85,105,.6)' : 'rgba(20,18,26,.5)';
      ell(c, x, y, 2 + R() * 4, 1.5 + R() * 3); c.fill();
    }
    c.strokeStyle = 'rgba(15,12,20,.6)'; c.lineWidth = 2;
    for(let i = 0; i < 60; i++){
      let x = R() * cw, y = R() * ch; c.beginPath(); c.moveTo(x, y);
      for(let k = 0; k < 4; k++){ x += (R() - 0.5) * 50; y += (R() - 0.5) * 30; c.lineTo(x, y); } c.stroke();
    }
    for(let i = 0; i < 40; i++){ // 骨頭
      const x = R() * cw, y = R() * ch, a = R() * Math.PI;
      c.save(); c.translate(x, y); c.rotate(a); c.fillStyle = 'rgba(230,225,210,.55)';
      c.fillRect(-7, -1.5, 14, 3); c.beginPath(); c.arc(-7, -2, 2.2, 0, PI2); c.arc(-7, 2, 2.2, 0, PI2); c.arc(7, -2, 2.2, 0, PI2); c.arc(7, 2, 2.2, 0, PI2); c.fill(); c.restore();
    }
    for(let i = 0; i < 230; i++){
      const edge = R() < 0.5;
      const x = edge ? (R() < 0.5 ? R() * 1.6 * TILE : cw - R() * 1.6 * TILE) : R() * cw;
      const y = edge ? R() * ch : (R() < 0.5 ? R() * 1.6 * TILE : ch - R() * 1.2 * TILE);
      const y2 = R() < 0.3 ? R() * ch : y, x2 = R() < 0.3 ? R() * cw : x;
      if(!free(x2, y2)) continue;
      const r = R();
      dec.push({t:r < 0.5 ? 'stalag' : r < 0.72 ? 'rock' : r < 0.92 ? 'crystal' : 'torch', x:x2, y:y2, s:0.8 + R() * 0.6, v:R()});
    }
  }
  if(M.theme === 'lava'){
    for(let i = 0; i < 7; i++){
      let x = R() * cw, y = R() * ch; const pts = [[x, y]];
      for(let k = 0; k < 8; k++){ x += (R() - 0.3) * 160; y += (R() - 0.5) * 120; pts.push([x, y]); }
      c.shadowColor = '#ff5a00'; c.shadowBlur = 20;
      path(pts, 18 + R() * 16, '#ff7a1a', '#7a1e05'); c.shadowBlur = 0;
      c.strokeStyle = '#ffd04a'; c.lineWidth = 4; c.beginPath(); pts.forEach((p, k) => k ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1])); c.stroke();
    }
    c.strokeStyle = 'rgba(255,90,20,.35)'; c.lineWidth = 1.5;
    for(let i = 0; i < 120; i++){
      let x = R() * cw, y = R() * ch; c.beginPath(); c.moveTo(x, y);
      for(let k = 0; k < 3; k++){ x += (R() - 0.5) * 40; y += (R() - 0.5) * 24; c.lineTo(x, y); } c.stroke();
    }
    // 魔王祭壇
    const ax = 0.88 * cw, ay = ch / 2;
    c.fillStyle = '#2a1512'; ell(c, ax, ay, 220, 150); c.fill();
    c.strokeStyle = '#ff3a1a'; c.lineWidth = 3; c.shadowColor = '#f00'; c.shadowBlur = 14;
    ell(c, ax, ay, 190, 125); c.stroke(); ell(c, ax, ay, 130, 85); c.stroke();
    for(let k = 0; k < 6; k++){ const a = k * PI2 / 6; c.beginPath(); c.moveTo(ax + Math.cos(a) * 130, ay + Math.sin(a) * 85); c.lineTo(ax + Math.cos(a + 2.094) * 130, ay + Math.sin(a + 2.094) * 85); c.stroke(); }
    c.shadowBlur = 0;
    avoid.push({x:ax, y:ay, r:230});
    for(let i = 0; i < 200; i++){
      const edge = R() < 0.5;
      let x = R() * cw, y = R() * ch;
      if(edge){ if(R() < 0.5) x = R() < 0.5 ? R() * 1.6 * TILE : cw - R() * 1.6 * TILE; else y = R() < 0.5 ? R() * 1.6 * TILE : ch - R() * 1.2 * TILE; }
      if(!free(x, y)) continue;
      const r = R();
      dec.push({t:r < 0.35 ? 'spike' : r < 0.6 ? 'deadtree' : r < 0.82 ? 'rock2' : 'vent', x, y, s:0.8 + R() * 0.5, v:R()});
    }
  }
  bakeExtra(M, c, R, cw, ch, dec, avoid, free, path);
  // 邊框
  const grd = c.createLinearGradient(0, 0, 0, 40);
  grd.addColorStop(0, 'rgba(0,0,0,.45)'); grd.addColorStop(1, 'rgba(0,0,0,0)');
  c.fillStyle = grd; c.fillRect(0, 0, cw, 40);
  dec.sort((a, b) => a.y - b.y);
  M.cache = {g, decos:dec, solids:sol};
  return M.cache;
}

function spawnPos(def, zone){
  const M = map;
  for(let tries = 0; tries < 60; tries++){
    const x = (zone[0] + Math.random() * (zone[1] - zone[0])) * M.w * TILE;
    const y = def.boss || def.elite ? M.h * TILE / 2 + rand(-40, 40) : rand(2.2, M.h - 2) * TILE;
    if(M.portals.some(p => Math.hypot(p.x * TILE - x, p.y * TILE - y) < TILE * 5)) continue;
    return {x, y};
  }
  return {x:M.w * TILE / 2, y:M.h * TILE / 2};
}
function makeMonster(type, zone, ov){
  const d = ov || MT[type], pos = spawnPos(d, zone);
  return {type, d, zone, x:pos.x, y:pos.y, hx:pos.x, hy:pos.y, hp:d.hp, cd:0, face:Math.random() < 0.5 ? 1 : -1, anim:Math.random() * 10,
    aggro:false, returning:false, dead:false, respawnT:0, hitFlash:0, slowT:0, stunT:0, wanderT:rand(0, 3), wx:pos.x, wy:pos.y, atkAnim:0, skillT:4, moving:false};
}

function loadMap(id, tx, ty, silent){
  mapId = id; map = MAPS[id];
  const cache = buildMap(id);
  decos = cache.decos; solids = cache.solids;
  if(id !== 'tower') TW = null;
  monsters = []; drops = []; projs = []; fxs = []; timers = []; parts = []; eprojs = []; goblinT = rand(40, 90);
  for(const [type, n, a, b] of map.monsters) for(let i = 0; i < n; i++) monsters.push(makeMonster(type, [a, b]));
  npcs = (map.npcs || []).map(n => ({...n, x:n.x * TILE, y:n.y * TILE, face:1, walk:0}));
  P.map = id;
  if(tx != null){ P.x = tx * TILE; P.y = ty * TILE; }
  P.target = null; P.moveTo = null; P.npcT = null; P.portalLock = 0.6;
  snapCam();
  if(!silent){ toast(map.name); msg(`進入了【${map.name}】${map.lvTxt ? '（' + map.lvTxt + '）' : ''}`, '#9fe'); }
  save();
}

const logEl = $('log');
function msg(t, col){
  const d = document.createElement('div'); d.textContent = t; d.style.color = col || '#fff';
  logEl.appendChild(d); while(logEl.children.length > 7) logEl.removeChild(logEl.firstChild);
}
let toastTO = 0;
function toast(t){ const el = $('toast'); el.textContent = t; el.style.opacity = 1; clearTimeout(toastTO); toastTO = setTimeout(() => el.style.opacity = 0, 1600); }
function ftext(x, y, txt, color, size, life){ texts.push({x, y, txt, color, size:size || 15, t:0, life:life || 0.9, vx:rand(-15, 15)}); }
function burst(x, y, color, n, spd, g){

    parts.push({x, y, vx:Math.cos(a) * v, vy:Math.sin(a) * v - (g ? 60 : 0), life:rand(0.35, 0.8), t:0, color, size:rand(2, 4.5), g:g || 0}); }
}

function after(t, fn){ timers.push({t, fn}); }

/* ================= 戰鬥 ================= */
function calcDmg(raw, def){ return Math.max(1, Math.round(raw * rand(0.9, 1.1) * (50 / (50 + def)))); }
function hitMonster(m, raw){
  if(m.dead) return;
  const crit = Math.random() * 100 < S.crit;
  let dmg = calcDmg(raw * (crit ? 1.8 : 1), m.d.def);
  m.hp -= dmg; m.hitFlash = 0.12; m.aggro = true; m.returning = false;
  ftext(m.x + rand(-8, 8), m.y - m.d.h - 6, (crit ? '暴擊 ' : '') + dmg, crit ? '#ffdd33' : '#fff', crit ? 21 : 15);
  burst(m.x, m.y - m.d.size, crit ? '#ffe066' : '#ffffff', crit ? 8 : 4, 110);
  if(m.hp <= 0) killMonster(m);
}
function hitPlayer(raw, src){
  if(P.dead) return;
  const dmg = calcDmg(raw, S.def);
  P.hp -= dmg; P.hitFlash = 0.15;
  ftext(P.x + rand(-6, 6), P.y - 96, '-' + dmg, '#ff5a5a', 16);
  if(P.hp <= 0){ P.hp = 0; die(src); }
}
function killMonster(m){
  m.dead = true; m.hp = 0; m.respawnT = m.d.respawn || rand(7, 12);
  if(P.target === m) P.target = null;
  burst(m.x, m.y - m.d.size, m.d.color, m.d.boss ? 60 : 16, m.d.boss ? 260 : 140, 200);
  if(m.d.boss){ shake = 0.6; ring(m.x, m.y, 260, '#ff6a00', 0.9, 8); }
  const diff = P.lv - m.d.lv;
  const em = clamp(1 - (diff - 5) * 0.12, 0.15, 1.3);
  const exp = Math.max(1, Math.round(m.d.exp * em));
  gainExp(exp);
  ftext(m.x, m.y - m.d.h - 26, '+' + exp + ' 經驗', '#b98cff', 13, 1.2);
  P.kills++;
  // 掉落
  drops.push({k:'gold', x:m.x + rand(-10, 10), y:m.y + rand(-6, 6), amt:randi(m.d.gold[0], m.d.gold[1]), t:0});
  if(Math.random() < 0.12) drops.push({k:Math.random() < 0.6 ? 'hp' : 'mp', x:m.x + rand(-22, 22), y:m.y + rand(-12, 12), amt:1, t:0});
  if(m.d.flee){
    for(let i = 0; i < 8; i++) drops.push({k:'gold', x:m.x + rand(-40, 40), y:m.y + rand(-20, 20), amt:randi(m.d.gold[0], m.d.gold[1]), t:0});
    drops.push({k:'hp', x:m.x + rand(-30, 30), y:m.y + rand(-15, 15), amt:1, t:0}); drops.push({k:'mp', x:m.x + rand(-30, 30), y:m.y + rand(-15, 15), amt:1, t:0});
    msg('擊倒寶藏哥布林！金幣散落一地！', '#f3dca0');
  }
  const nItems = m.d.flee ? 3 : m.d.boss ? 4 : m.d.elite ? 2 : (Math.random() < 0.13 ? 1 : 0);
  for(let i = 0; i < nItems; i++){
    const slot = SLOT_ORDER[Math.floor(Math.random() * 5)];
    const q = m.d.boss ? Math.max(2, rollQ(0.08)) : (m.d.elite || m.d.flee) ? Math.max(1, rollQ(0.05)) : rollQ(0);
    const it = genItem(slot, m.d.lv + randi(-1, 2), q);
    drops.push({k:'item', x:m.x + rand(-30, 30), y:m.y + rand(-16, 16), item:it, t:0});
    if(q >= 3) msg(`【${QN[q]}】${it.name} 掉落了！`, QC[q]);
  }
  // 任務
  if(P.bounty && P.bounty.m === m.type && P.bounty.c < P.bounty.n){
    P.bounty.c++;
    if(P.bounty.c >= P.bounty.n) msg('懸賞目標達成，回懸賞官處領賞！', '#8ae08a');
  }
  const Q = QUESTS[P.quest.i];
  if(Q && P.quest.acc && Q.m === m.type && P.quest.c < Q.n){
    P.quest.c++;
    if(P.quest.c >= Q.n){ msg(`任務【${Q.t}】已完成，回村長處領獎！`, '#7dff8a'); toast('任務完成！'); }
  }
  if(m.d.boss) msg(`★ ${P.name} 擊敗了 ${m.d.name}！英雄之名響徹大陸！`, '#ff9f1c');
}
function gainExp(n){
  P.exp += n;
  let up = false;
  while(P.exp >= expNeed(P.lv)){ P.exp -= expNeed(P.lv); P.lv++; up = true;
    SKILLS[P.cls].forEach(sk => { if(sk.lv === P.lv) msg(`領悟了新技能【${sk.name}】！`, '#ffd76a'); });
  }
  if(up){
    S = stats(); P.hp = S.maxHp; P.mp = S.maxMp;
    toast(`等級提升！Lv ${P.lv}`); msg(`恭喜升到 ${P.lv} 級！獲得屬性點，按 C 分配`, '#ffe066');
    ring(P.x, P.y, 90, '#ffe066', 0.8, 6); burst(P.x, P.y - 30, '#ffe066', 30, 160, 100);
    buildSkillbar(); save();
  }
}
function die(src){
  P.dead = true; P.target = null; P.moveTo = null;
  $('deathMsg').textContent = `你被【${src || '未知敵人'}】擊敗了……回城復活會損失少量經驗。`;
  $('death').classList.remove('hidden');
  for(const m of monsters){ m.aggro = false; m.returning = true; }
}
function revive(){
  $('death').classList.add('hidden');
  P.dead = false; P.exp = Math.max(0, Math.floor(P.exp - expNeed(P.lv) * 0.05));
  S = stats(); P.hp = S.maxHp; P.mp = S.maxMp;
  loadMap('village', 16, 13);
  msg('你在晨曦村復活了', '#9fe');
}
function nearestMonster(maxD){
  let best = null, bd = maxD || 1e9;
  for(const m of monsters){ if(m.dead) continue; const d = dist(P, m); if(d < bd){ bd = d; best = m; } }
  return best;
}
function basicAttack(m){
  const C = CLASSES[P.cls];
  P.atkCd = C.cd; P.atkAnim = 1; P.face = m.x >= P.x ? 1 : -1;
  if(!C.proj){
    hitMonster(m, S.atk);
    fxs.push({k:'slash', x:P.x + P.face * 22, y:P.y - 44, f:P.face, t:0, life:0.2, color:'#fff'});
  } else {
    projs.push({x:P.x + P.face * 14, y:P.y - 50, tgt:m, speed:C.proj === 'arrow' ? 560 : 400, dmg:S.atk, kind:C.proj, color:C.proj === 'arrow' ? '#ffe9a8' : '#a9c8ff', homing:true, life:2, hit:new Set(), vx:0, vy:0, aoe:0});
  }
}
function useSkill(i, silent){
  if(!P || P.dead) return false;
  const sk = SKILLS[P.cls][i]; if(!sk) return false;
  if(P.lv < sk.lv){ if(!silent) msg(`【${sk.name}】需要等級 ${sk.lv}`, '#ff8a8a'); return false; }
  if(P.scd[i] > 0) return false;
  if(P.mp < sk.mp){ if(!silent) msg('魔力不足！', '#7ab8ff'); return false; }
  if(map.safe && sk.type !== 'buff'){ if(!silent) msg('安全區內無法使用攻擊技能', '#ff8a8a'); return false; }
  let tgt = P.target && !P.target.dead ? P.target : null;
  if(['proj', 'dash', 'fan', 'aoeTarget'].includes(sk.type)){
    if(!tgt || dist(P, tgt) > sk.range + tgt.d.size) tgt = nearestMonster(sk.range);
    if(!tgt){ if(!silent) msg('技能範圍內沒有目標', '#ff8a8a'); return false; }
    P.target = tgt; P.face = tgt.x >= P.x ? 1 : -1;
  }
  P.mp -= sk.mp; P.scd[i] = sk.cd; P.atkAnim = 1;
  ftext(P.x, P.y - 108, sk.name, sk.fx, 14, 0.8);
  const base = S.atk * (sk.mult || 0) * skillMult(i);
  switch(sk.type){
    case 'aoeSelf':
      ring(P.x, P.y - 10, sk.r, sk.fx, 0.45, 6);
      fxs.push({k:sk.slow ? 'frost' : 'spin', x:P.x, y:P.y - 14, r:sk.r, t:0, life:0.45, color:sk.fx});
      for(const m of monsters) if(!m.dead && dist(P, m) < sk.r + m.d.size){ hitMonster(m, base); if(sk.slow) m.slowT = sk.slow; }
      break;
    case 'dash': {
      const a = Math.atan2(tgt.y - P.y, tgt.x - P.x), dd = Math.max(0, dist(P, tgt) - tgt.d.size - 18);
      for(let k = 0; k < 8; k++) parts.push({x:P.x + Math.cos(a) * dd * k / 8, y:P.y - 20 + Math.sin(a) * dd * k / 8, vx:0, vy:-20, life:0.4, t:0, color:sk.fx, size:6, g:0});
      moveEnt(P, Math.cos(a) * dd, Math.sin(a) * dd);
      hitMonster(tgt, base); if(!tgt.dead) tgt.stunT = sk.stun;
      ring(tgt.x, tgt.y, 50, sk.fx, 0.3, 5); shake = 0.15;
      break;
    }
    case 'buff':
      P.buffT = sk.dur + (P.skLv[i] - 1) * 0.5; P.hp = Math.min(S.maxHp, P.hp + S.maxHp * sk.heal);
      ring(P.x, P.y, 70, sk.fx, 0.6, 6); burst(P.x, P.y - 30, sk.fx, 24, 140, 80);
      ftext(P.x, P.y - 122, '攻擊力 +50%', '#ff9a6a', 13, 1.2);
      break;
    case 'proj':
      projs.push({x:P.x + P.face * 14, y:P.y - 50, tgt, speed:sk.speed, dmg:base, kind:sk.pierce ? 'pierce' : 'fireball', color:sk.fx,
        homing:!sk.pierce, pierce:!!sk.pierce, aoe:sk.aoe || 0, life:sk.pierce ? 0.9 : 2, hit:new Set(),
        vx:0, vy:0, ang:Math.atan2(tgt.y - 14 - (P.y - 50), tgt.x - P.x)});
      break;
    case 'fan': {
      const a0 = Math.atan2(tgt.y - 14 - (P.y - 50), tgt.x - P.x);
      for(let k = 0; k < sk.n; k++){
        const a = a0 + (k - (sk.n - 1) / 2) * 0.17;
        projs.push({x:P.x + P.face * 14, y:P.y - 50, tgt:null, speed:sk.speed, dmg:base, kind:'arrow', color:sk.fx, homing:false, pierce:false, aoe:0, life:0.7, hit:new Set(), ang:a, vx:Math.cos(a) * sk.speed, vy:Math.sin(a) * sk.speed});
      }
      break;
    }
    case 'aoeTarget': {
      const tx = tgt.x, ty = tgt.y;
      fxs.push({k:'zone', x:tx, y:ty, r:sk.r, t:0, life:0.3 + sk.hits * 0.28, color:sk.fx});
      for(let k = 0; k < sk.hits; k++){
        const ox = tx + rand(-sk.r * 0.6, sk.r * 0.6), oy = ty + rand(-sk.r * 0.4, sk.r * 0.4);
        after(0.1 + k * 0.28, () => fxs.push({k:P.cls === 'mage' ? 'meteor' : 'arrowfall', x:ox, y:oy, t:0, life:0.25, color:sk.fx}));
        after(0.35 + k * 0.28, () => {
          ring(ox, oy, 50, sk.fx, 0.35, 4); burst(ox, oy - 6, sk.fx, 10, 150, 120);
          for(const m of monsters) if(!m.dead && Math.hypot(m.x - tx, m.y - ty) < sk.r + m.d.size) hitMonster(m, base);
          if(P.cls === 'mage') shake = Math.max(shake, 0.1);
        });
      }
      break;
    }
  }
  return true;
}
function usePot(k, silent){
  if(!P || P.dead || P.potCd > 0) return;
  if(k === 'hp'){
    if(P.hpPot <= 0){ if(!silent) msg('沒有紅藥水了！去雜貨商購買吧', '#ff8a8a'); return; }
    if(P.hp >= S.maxHp) return;
    P.hpPot--; const v = Math.round(S.maxHp * 0.35 + 40); P.hp = Math.min(S.maxHp, P.hp + v); ftext(P.x, P.y - 100, '+' + v, '#6fff6f', 15);
  } else {
    if(P.mpPot <= 0){ if(!silent) msg('沒有藍藥水了！去雜貨商購買吧', '#ff8a8a'); return; }
    if(P.mp >= S.maxMp) return;
    P.mpPot--; const v = Math.round(S.maxMp * 0.4 + 25); P.mp = Math.min(S.maxMp, P.mp + v); ftext(P.x, P.y - 100, '+' + v, '#7ab8ff', 15);
  }
  P.potCd = 0.8; burst(P.x, P.y - 30, k === 'hp' ? '#ff7a7a' : '#7ab8ff', 10, 70, 60);
}
function toggleAuto(){
  P.auto = !P.auto; P.manualT = 0;
  msg(P.auto ? '開啟自動掛機：自動打怪、撿物、喝藥' : '關閉自動掛機', P.auto ? '#7dff8a' : '#ccc');
  if(P.auto && map.safe) msg('提示：安全區沒有怪物，請先前往野外地圖', '#ffd76a');
}
function goTown(){
  if(P.dead) return;
  if(mapId === 'village'){ msg('你已經在村莊裡了'); return; }
  ring(P.x, P.y, 60, '#9fe8ff', 0.6, 6); burst(P.x, P.y - 30, '#9fe8ff', 20, 120, 60);
  loadMap('village', 16, 13);
}

/* ================= 移動 / 碰撞 ================= */
function moveEnt(e, dx, dy){
  e.x = clamp(e.x + dx, TILE * 0.6, map.w * TILE - TILE * 0.6);
  e.y = clamp(e.y + dy, TILE * 0.9, map.h * TILE - TILE * 0.35);
  for(const s of solids){
    const r = 9;
    if(e.x > s.x1 - r && e.x < s.x2 + r && e.y > s.y1 - r && e.y < s.y2 + r){
      const pl = e.x - (s.x1 - r), pr = (s.x2 + r) - e.x, pt = e.y - (s.y1 - r), pb = (s.y2 + r) - e.y;
      const mn = Math.min(pl, pr, pt, pb);
      if(mn === pl) e.x = s.x1 - r; else if(mn === pr) e.x = s.x2 + r; else if(mn === pt) e.y = s.y1 - r; else e.y = s.y2 + r;
    }
  }
}
function stepToward(e, tx, ty, spd, dt){
  const dx = tx - e.x, dy = ty - e.y, d = Math.hypot(dx, dy);
  if(d < 1) return false;
  const st = Math.min(d, spd * dt);
  moveEnt(e, dx / d * st, dy / d * st);
  if(Math.abs(dx) > 2) e.face = dx > 0 ? 1 : -1;
  return true;
}

/* ================= 更新 ================= */
function update(dt){
  S = stats();
  updatePlayer(dt);
  updateMonsters(dt);
  updateProjs(dt);
  updateExtra(dt);
  for(let i = timers.length - 1; i >= 0; i--){ const t = timers[i]; t.t -= dt; if(t.t <= 0){ timers.splice(i, 1); t.fn(); } }
  for(let i = fxs.length - 1; i >= 0; i--){ const f = fxs[i]; f.t += dt; if(f.t >= f.life){ fxs.splice(i, 1); if(f.end) f.end(); } }
  for(let i = parts.length - 1; i >= 0; i--){ const p = parts[i]; p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.g * dt; p.vx *= 0.96; if(p.t >= p.life) parts.splice(i, 1); }
  for(let i = texts.length - 1; i >= 0; i--){ const t = texts[i]; t.t += dt; t.y -= 38 * dt; t.x += t.vx * dt; if(t.t >= t.life) texts.splice(i, 1); }
  for(const d of drops) d.t += dt;
  for(const n of npcs) n.walk += dt;
  // 環境粒子
  if(map.theme === 'lava' && Math.random() < dt * 14){ parts.push({x:cam.x + Math.random() * W / ZOOM, y:cam.y + H / ZOOM + 10, vx:rand(-10, 10), vy:rand(-60, -30), life:rand(2, 4), t:0, color:'#ff8a3d', size:rand(1.5, 3), g:0}); }
  if(map.theme === 'forest' && Math.random() < dt * 3){ parts.push({x:cam.x + Math.random() * W / ZOOM, y:cam.y + Math.random() * H / ZOOM, vx:rand(-8, 8), vy:rand(-12, -4), life:rand(2, 4), t:0, color:'#f6ff9a', size:2, g:0, glow:true}); }
  if(shake > 0) shake -= dt;
  updateCam(dt);
  saveT -= dt; if(saveT <= 0){ saveT = 10; save(); }
}

function updatePlayer(dt){
  P.atkCd -= dt; P.potCd -= dt; P.buffT -= dt; P.hitFlash -= dt; P.portalLock -= dt; P.invFullWarn -= dt;
  for(let i = 0; i < 3; i++) P.scd[i] = Math.max(0, P.scd[i] - dt);
  P.atkAnim = Math.max(0, P.atkAnim - dt * 4);
  if(P.dead){ P.moving = false; return; }
  // 回復
  const inCombat = monsters.some(m => m.aggro && !m.dead);
  const rg = map.safe ? 0.06 : inCombat ? 0.004 : 0.015;
  P.hp = Math.min(S.maxHp, P.hp + S.maxHp * rg * dt);
  P.mp = Math.min(S.maxMp, P.mp + S.maxMp * (rg + 0.006) * dt);

  let mx = 0, my = 0, moving = false;
  if(keys.w || keys.arrowup) my--; if(keys.s || keys.arrowdown) my++;
  if(keys.a || keys.arrowleft) mx--; if(keys.d || keys.arrowright) mx++;
  const ox = P.x, oy = P.y;
  if(mx || my){
    P.target = null; P.moveTo = null; P.npcT = null; P.manualT = 2.5;
    const l = Math.hypot(mx, my); moveEnt(P, mx / l * S.spd * dt, my / l * S.spd * dt); moving = true;
    if(mx) P.face = mx > 0 ? 1 : -1;
  } else {
    if(P.manualT > 0) P.manualT -= dt;
    if(P.auto && P.manualT <= 0){
      if(P.hp < S.maxHp * 0.45) usePot('hp', true);
      if(P.mp < S.maxMp * 0.25) usePot('mp', true);
      P.autoT -= dt;
      if((!P.target && !P.npcT && (!P.moveTo || (P.autoWander && P.autoT <= 0)))){ P.autoT = 0.8; autoThink(); }
      if(P.target && !P.target.dead){
        const dT = dist(P, P.target);
        SKILLS[P.cls].forEach((sk, i) => {
          if(P.scd[i] > 0 || P.lv < sk.lv || P.mp < sk.mp) return;
          if(sk.type === 'aoeSelf' && dT > sk.r * 0.8) return;
          if(sk.type === 'buff' && dT > 260) return;
          if(sk.range && dT > sk.range) return;
          useSkill(i, true);
        });
      }
    }
    if(P.target){
      const m = P.target;
      if(m.dead || map.safe) P.target = null;
      else {
        const d = dist(P, m), range = CLASSES[P.cls].range + m.d.size * 0.6;
        if(d > range) moving = stepToward(P, m.x, m.y, S.spd, dt);
        else { P.face = m.x >= P.x ? 1 : -1; if(P.atkCd <= 0) basicAttack(m); }
      }
    } else if(P.npcT){
      const n = P.npcT;
      if(Math.hypot(n.x - P.x, n.y - P.y) < 58){ P.npcT = null; openNpc(n.id); }
      else moving = stepToward(P, n.x, n.y, S.spd, dt);
    } else if(P.moveTo){
      if(Math.hypot(P.moveTo.x - P.x, P.moveTo.y - P.y) < 4){ P.moveTo = null; P.autoWander = false; }
      else moving = stepToward(P, P.moveTo.x, P.moveTo.y, S.spd, dt);
    }
    // 卡住偵測
    if(moving && Math.hypot(P.x - ox, P.y - oy) < S.spd * dt * 0.25){ P.stuckT += dt; if(P.stuckT > 0.5){ P.moveTo = null; P.stuckT = 0; P.autoWander = false; } }
    else P.stuckT = 0;
  }
  P.moving = moving; if(moving) P.walk += dt * 12;
  // 傳送門
  if(P.portalLock <= 0) for(const p of map.portals){
    if(Math.hypot(p.x * TILE - P.x, p.y * TILE - P.y) < 30){ loadMap(p.to, p.tx, p.ty); return; }
  }
  // 撿取
  for(let i = drops.length - 1; i >= 0; i--){
    const d = drops[i]; if(d.t < 0.35) continue;
    if(Math.hypot(d.x - P.x, d.y - P.y) < (d.k === 'gold' ? 46 : 34)){
      if(d.k === 'gold'){ P.gold += d.amt; ftext(d.x, d.y - 20, '+' + d.amt + ' 金', '#ffd76a', 13); }
      else if(d.k === 'hp'){ P.hpPot++; ftext(d.x, d.y - 20, '紅藥水 +1', '#ff8a8a', 13); }
      else if(d.k === 'mp'){ P.mpPot++; ftext(d.x, d.y - 20, '藍藥水 +1', '#8ab8ff', 13); }
      else {
        if(P.inv.length >= INV_MAX){ if(P.invFullWarn <= 0){ msg('背包已滿！請出售裝備', '#ff8a8a'); P.invFullWarn = 5; } continue; }
        P.inv.push(d.item); msg(`獲得 ${QN[d.item.q]}裝備：${d.item.name}`, QC[d.item.q]);
      }
      drops.splice(i, 1);
    }
  }
}
function autoThink(){
  P.autoWander = false;
  let best = null, bd = 280;
  for(const d of drops){ if(d.k === 'item' && P.inv.length >= INV_MAX) continue; const dd = dist(P, d); if(dd < bd){ bd = dd; best = d; } }
  if(best){ P.moveTo = {x:best.x, y:best.y}; return; }
  if(map.safe) return;
  let tm = null; bd = 1e9;
  for(const m of monsters){
    if(m.dead) continue;
    if((m.d.boss || m.d.elite) && P.lv < m.d.lv - 2 && !m.aggro && !map.instance) continue;
    let d = dist(P, m); if(m.aggro) d *= 0.4; if(m.d.flee) d *= 0.2;
    if(d < bd){ bd = d; tm = m; }
  }
  if(tm && (bd < 900 || map.instance)){ P.target = tm; return; }
  if(map.instance) return;
  P.moveTo = {x:rand(3, map.w - 3) * TILE, y:rand(3, map.h - 3) * TILE}; P.autoWander = true;
}

function updateMonsters(dt){
  for(const m of monsters){
    const d = m.d;
    if(m.dead){
      m.respawnT -= dt;
      if(m.respawnT <= 0){ const pos = spawnPos(d, m.zone); Object.assign(m, {dead:false, hp:d.hp, x:pos.x, y:pos.y, hx:pos.x, hy:pos.y, aggro:false, returning:false, slowT:0, stunT:0}); burst(m.x, m.y - 10, '#fff', 8, 60); }
      continue;
    }
    m.anim += dt; m.cd -= dt; m.hitFlash -= dt; m.slowT -= dt; m.stunT -= dt; m.atkAnim = Math.max(0, m.atkAnim - dt * 4);
    m.moving = false;
    if(m.stunT > 0) continue;
    if(d.flee){ fleeUpdate(m, dt, dist(m, P)); continue; }
    const spd = d.spd * (m.slowT > 0 ? 0.45 : 1);

            const tx = P.x, ty = P.y, r = d.boss ? 105 : 80, col = d.fx || (d.boss ? '#ff3a1a' : '#9cff5a');

      m.hp = Math.min(d.hp, m.hp + d.hp * 0.25 * dt);

function updateProjs(dt){
  for(let i = projs.length - 1; i >= 0; i--){
    const p = projs[i];

      const a = Math.atan2(p.tgt.y - p.tgt.d.size - p.y, p.tgt.x - p.x); p.ang = a;
      p.vx = Math.cos(a) * p.speed; p.vy = Math.sin(a) * p.speed;
    } else if(p.vx === 0 && p.vy === 0){ p.vx = Math.cos(p.ang || 0) * p.speed; p.vy = Math.sin(p.ang || 0) * p.speed; }
    else if(p.homing){ p.homing = false; p.life = Math.min(p.life, 0.4); }
    p.x += p.vx * dt; p.y += p.vy * dt;
    if(p.kind === 'fireball' || p.kind === 'bolt') parts.push({x:p.x, y:p.y, vx:rand(-20, 20), vy:rand(-20, 20), life:0.25, t:0, color:p.color, size:p.kind === 'fireball' ? 5 : 3, g:0});
    let remove = p.life <= 0;
    for(const m of monsters){
      if(m.dead || p.hit.has(m)) continue;
      if(Math.hypot(m.x - p.x, m.y - m.d.size - p.y) < m.d.size + 10){
        if(p.aoe){
          ring(p.x, p.y, p.aoe, p.color, 0.35, 5); burst(p.x, p.y, p.color, 16, 160);
          for(const o of monsters) if(!o.dead && Math.hypot(o.x - p.x, o.y - o.d.size - p.y) < p.aoe + o.d.size) hitMonster(o, p.dmg);
          remove = true; break;
        }
        hitMonster(m, p.dmg); p.hit.add(m);
        if(!p.pierce){ remove = true; break; }
      }
    }
    if(remove) projs.splice(i, 1);
  }
}

}

function render(){
  const th = THEMES[map.theme];

  let sx = 0, sy = 0; if(shake > 0){ sx = rand(-4, 4); sy = rand(-4, 4); }
  ctx.setTransform(DPR * ZOOM, 0, 0, DPR * ZOOM, (-cam.x * ZOOM + sx) * DPR, (-cam.y * ZOOM + sy) * DPR);
  const vx0 = cam.x - 80, vy0 = cam.y - 40, vx1 = cam.x + viewW() + 80, vy1 = cam.y + viewH() + 160;
  ctx.drawImage(map.cache.g, 0, 0);
  if(map.theme === 'lava'){ ctx.globalAlpha = 0.08 + Math.sin(gt * 2) * 0.05; ctx.fillStyle = '#ff4a00'; ctx.fillRect(cam.x, cam.y, viewW(), viewH()); ctx.globalAlpha = 1; }

    const k = f.t / f.life;
    if(f.k === 'warn'){ ctx.fillStyle = f.color; ctx.globalAlpha = 0.15 + k * 0.25; ell(ctx, f.x, f.y, f.r, f.r * 0.55); ctx.fill(); ctx.globalAlpha = 0.9; ctx.strokeStyle = f.color; ctx.lineWidth = 2; ell(ctx, f.x, f.y, f.r * k, f.r * 0.55 * k); ctx.stroke(); ell(ctx, f.x, f.y, f.r, f.r * 0.55); ctx.stroke(); ctx.globalAlpha = 1; }
    if(f.k === 'zone'){ ctx.globalAlpha = 0.25 * (1 - k * 0.5); ctx.fillStyle = f.color; ell(ctx, f.x, f.y, f.r, f.r * 0.55); ctx.fill(); ctx.globalAlpha = 1; }
  }
  if(P.target && !P.target.dead){ const m = P.target; ctx.strokeStyle = '#ff4a4a'; ctx.lineWidth = 2.5; ctx.setLineDash([6, 4]); ctx.lineDashOffset = -gt * 20; ell(ctx, m.x, m.y, m.d.size + 8, (m.d.size + 8) * 0.4); ctx.stroke(); ctx.setLineDash([]); }
  if(P.moveTo && !P.autoWander){ ctx.strokeStyle = 'rgba(140,255,180,.8)'; ctx.lineWidth = 2; const r = 6 + Math.sin(gt * 8) * 2; ell(ctx, P.moveTo.x, P.moveTo.y, r * 1.6, r * 0.7); ctx.stroke(); }
  for(const d of drops) if(d.x > vx0 && d.x < vx1 && d.y > vy0 && d.y < vy1) drawDrop(d);
  // y 排序
  const list = [];
  for(const o of decos) if(o.x > vx0 - 60 && o.x < vx1 + 60 && o.y > vy0 && o.y < vy1 + 40) list.push([o.y, 0, o]);
  for(const m of monsters) if(!m.dead && m.x > vx0 && m.x < vx1 && m.y > vy0 && m.y < vy1 + 80) list.push([m.y, 1, m]);
  for(const n of npcs) list.push([n.y, 2, n]);
  list.push([P.y, 3, P]);
  list.sort((a, b) => a[0] - b[0]);
  for(const [, k, o] of list){
    if(k === 0) drawDeco(o);
    else if(k === 1) drawMonster(o);
    else if(k === 2) drawNpc(o);
    else drawPlayer();
  }
  for(const m of monsters) if(!m.dead && m.x > vx0 && m.x < vx1 && m.y > vy0 && m.y < vy1 + 80) drawMonsterUI(m);
  // 投射物
  for(const p of projs){
    ctx.save(); ctx.translate(p.x, p.y);
    const a = Math.atan2(p.vy, p.vx); ctx.rotate(a);
    if(p.kind === 'arrow' || p.kind === 'pierce'){
      if(p.kind === 'pierce'){ ctx.shadowColor = p.color; ctx.shadowBlur = 12; ctx.strokeStyle = p.color; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(-30, 0); ctx.lineTo(0, 0); ctx.stroke(); }
      ctx.fillStyle = '#8b5a2b'; ctx.fillRect(-14, -1, 16, 2); ctx.fillStyle = '#ddd'; ctx.beginPath(); ctx.moveTo(6, 0); ctx.lineTo(0, -3.5); ctx.lineTo(0, 3.5); ctx.fill();

    } else {
      ctx.shadowColor = p.color; ctx.shadowBlur = 16; ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(0, 0, p.kind === 'fireball' ? 9 : 6, 0, PI2); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, 0, p.kind === 'fireball' ? 4 : 3, 0, PI2); ctx.fill();
    }
    ctx.restore();
  }
  drawEprojs();
  // 特效
  for(const f of fxs){
    const k = f.t / f.life;
    if(f.k === 'ring'){ ctx.globalAlpha = 1 - k; ctx.strokeStyle = f.color; ctx.lineWidth = f.w * (1 - k) + 1; ell(ctx, f.x, f.y, f.r * (0.3 + k * 0.7), f.r * 0.55 * (0.3 + k * 0.7)); ctx.stroke(); ctx.globalAlpha = 1; }
    else if(f.k === 'slash'){ ctx.save(); ctx.translate(f.x, f.y); ctx.scale(f.f, 1); ctx.globalAlpha = 1 - k; ctx.strokeStyle = '#fff'; ctx.lineWidth = 4 * (1 - k) + 1; ctx.beginPath(); ctx.arc(-10, 4, 26, -1.4 + k * 0.6, 0.9 + k * 0.6); ctx.stroke(); ctx.restore(); ctx.globalAlpha = 1; }
    else if(f.k === 'spin'){ ctx.save(); ctx.translate(f.x, f.y); ctx.scale(1, 0.55); ctx.rotate(k * 9); ctx.globalAlpha = 1 - k; ctx.strokeStyle = f.color; ctx.lineWidth = 8;
      for(let q = 0; q < 3; q++){ ctx.beginPath(); ctx.arc(0, 0, f.r * (0.5 + q * 0.2), q * 2.1, q * 2.1 + 1.5); ctx.stroke(); } ctx.restore(); ctx.globalAlpha = 1; }
    else if(f.k === 'frost'){ ctx.save(); ctx.translate(f.x, f.y); ctx.globalAlpha = 1 - k; ctx.fillStyle = f.color;
      for(let q = 0; q < 12; q++){ const a = q * PI2 / 12, rd = f.r * (0.2 + k * 0.8); ctx.save(); ctx.translate(Math.cos(a) * rd, Math.sin(a) * rd * 0.55); ctx.rotate(a); ctx.beginPath(); ctx.moveTo(10, 0); ctx.lineTo(0, -4); ctx.lineTo(-6, 0); ctx.lineTo(0, 4); ctx.closePath(); ctx.fill(); ctx.restore(); }
      ctx.restore(); ctx.globalAlpha = 1; }
    else if(f.k === 'meteor' || f.k === 'arrowfall'){
      const sx0 = f.x + 90, sy0 = f.y - 260, cx = sx0 + (f.x - sx0) * k, cy = sy0 + (f.y - sy0) * k;
      if(f.k === 'meteor'){ ctx.shadowColor = '#ff5a00'; ctx.shadowBlur = 20; ctx.strokeStyle = 'rgba(255,160,60,.6)'; ctx.lineWidth = 10; ctx.beginPath(); ctx.moveTo(cx + 30, cy - 80); ctx.lineTo(cx, cy); ctx.stroke(); ctx.fillStyle = '#ffd04a'; ctx.beginPath(); ctx.arc(cx, cy, 11, 0, PI2); ctx.fill(); ctx.shadowBlur = 0; }
      else { ctx.strokeStyle = f.color; ctx.lineWidth = 2; for(let q = -2; q <= 2; q++){ ctx.beginPath(); ctx.moveTo(cx + q * 14 + 12, cy - 30 + Math.abs(q) * 5); ctx.lineTo(cx + q * 14, cy + Math.abs(q) * 5); ctx.stroke(); } }
    }
  }
  // 粒子
  for(const p of parts){
    const a = 1 - p.t / p.life; ctx.globalAlpha = a; ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.5 + a * 0.5), 0, PI2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  // 黑暗
  if(th.dark){
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const px = (P.x - cam.x) * ZOOM, py = (P.y - 40 - cam.y) * ZOOM;

  }
  // 文字

  for(const t of texts){

  }

}

// ---- 屬性點 ----
const ATTRS = [
  {k:'str', n:'力量', d:'每點 +0.8 攻擊'},
  {k:'vit', n:'體質', d:'每點 +6 生命、+0.3 防禦'},

];
function attrTotal(){ const a = P.attr; return a.str + a.vit + a.agi + a.int; }
function attrFree(){ return (P.lv - 1) * 3 - attrTotal(); }
// ---- 技能修煉 ----
const SK_MAX = 10;
function skillMult(i){ return 1 + 0.15 * ((P.skLv[i] || 1) - 1); }
function skillCost(i){ const sk = SKILLS[P.cls][i], l = P.skLv[i]; return Math.round((sk.lv * 30 + 80) * l * l); }
function skillReqLv(i){ return SKILLS[P.cls][i].lv + P.skLv[i] * 4; }

// ---- 懸賞 ----
function bountyPick(){
  const pool = [];
  for(const id in MAPS){ const M = MAPS[id]; if(M.instance) continue; for(const [t] of M.monsters){ const d = MT[t]; if(!d.elite && !d.boss && !d.flee) pool.push(t); } }
  let cands = pool.filter(t => MT[t].lv <= P.lv + 3 && MT[t].lv >= P.lv - 8);
  if(!cands.length) cands = [pool.reduce((b, t) => Math.abs(MT[t].lv - P.lv) < Math.abs(MT[b].lv - P.lv) ? t : b, pool[0])];
  const m = cands[randi(0, cands.length - 1)], d = MT[m], n = randi(15, 25);
  return {m, n, c:0, gold:Math.round(d.gold[1] * n * 1.5 + d.lv * 20), exp:Math.round(d.exp * n * 1.2)};
}
function mapOf(type){ for(const id in MAPS) if(MAPS[id].monsters.some(e => e[0] === type)) return MAPS[id].name; return ''; }

// ---- 試煉之塔 ----
let TW = null;
const TOWER_TIME = 120;
function towerPool(L, elite){
  const list = Object.keys(MT).filter(k => { const d = MT[k]; return !d.flee && (elite ? (d.elite || d.boss) : !(d.elite || d.boss)); });
  list.sort((a, b) => Math.abs(MT[a].lv - L) - Math.abs(MT[b].lv - L));
  return list.slice(0, elite ? 1 : 3);
}
function scaledDef(type, L, hpMul){
  const d = MT[type], r = clamp(L / d.lv, 0.5, 1.8);
  return {...d, lv:L, hp:Math.round(d.hp * Math.pow(r, 1.4) * (hpMul || 1)), atk:Math.round(d.atk * r), def:Math.round(d.def * r), exp:Math.round(d.exp * r),
    gold:[Math.round(d.gold[0] * r), Math.round(d.gold[1] * r)], respawn:1e9};
}
function towerStart(f){ TW = {floor:f, timer:TOWER_TIME, state:'fight', waitT:0}; loadMap('tower', 11, 12); towerSpawn(); }
function towerSpawn(){
  const f = TW.floor, L = 4 + f * 2, boss = f % 5 === 0;
  monsters = [];
  const pool = towerPool(L, false), n = boss ? 4 : Math.min(14, 5 + Math.floor(f / 2));
  for(let i = 0; i < n; i++){ const t = pool[randi(0, pool.length - 1)]; monsters.push(makeMonster(t, [0.12, 0.88], scaledDef(t, L))); }
  if(boss){ const t = towerPool(L + 2, true)[0]; monsters.push(makeMonster(t, [0.45, 0.55], scaledDef(t, L + 2, 0.5))); }
  for(const m of monsters){ m.aggro = true; m.y = m.hy = clamp(m.y, 2.5 * TILE, (map.h - 5) * TILE); }
  TW.timer = TOWER_TIME + (boss ? 60 : 0); TW.state = 'fight';
  toast(`試煉之塔 第 ${f} 層${boss ? '・首領' : ''}`);
}
function towerUpdate(dt){
  if(!TW || mapId !== 'tower' || P.dead) return;
  if(TW.state === 'fight'){
    TW.timer -= dt;
    if(monsters.every(m => m.dead)){
      const f = TW.floor, L = 4 + f * 2, bossF = f % 5 === 0;
      const gold = Math.round(25 * L * (bossF ? 3 : 1)), exp = Math.round(expNeed(Math.min(P.lv, L + 2)) * (bossF ? 0.12 : 0.05));
      P.gold += gold; gainExp(exp);
      if(bossF){ const it = genItem(SLOT_ORDER[randi(0, 4)], L + 2, Math.max(2, rollQ(0.08))); drops.push({k:'item', x:P.x + 30, y:P.y + 10, item:it, t:0}); }
      if(f > (P.towerBest || 0)){ P.towerBest = f; msg(`試煉之塔新紀錄：第 ${f} 層！`, '#f3dca0'); }
      msg(`第 ${f} 層通關！獲得 ${gold} 金幣、${exp} 經驗`, '#8ae08a'); toast(`第 ${f} 層通關`);
      TW.state = 'wait'; TW.waitT = 4; save();
    } else if(TW.timer <= 0){ msg(`試煉失敗：第 ${TW.floor} 層超時`, '#ff8a8a'); TW = null; loadMap('village', 16, 17.8); }
  } else if(TW.state === 'wait'){
    TW.waitT -= dt;
    if(TW.waitT <= 0){ TW.floor++; towerSpawn(); }
  }
}

let goblinT = 60;
function goblinUpdate(dt){
  if(map.safe || map.instance || P.dead) return;

  if(goblinT > 0) return;
  goblinT = rand(70, 130);
  if(monsters.some(m => m.d.flee && !m.dead)) return;
  const lvs = map.monsters.map(e => MT[e[0]].lv), L = Math.round(lvs.reduce((a, b) => a + b, 0) / lvs.length);
  const def = {...MT.goblin, lv:L, hp:60 + L * 45, def:Math.round(L * 0.6), exp:MT.goblin.exp * L, gold:[L * 6, L * 10], respawn:1e9};
  const a = Math.random() * PI2, r = rand(260, 360), m = makeMonster('goblin', [0.1, 0.9], def);
  m.x = m.hx = clamp(P.x + Math.cos(a) * r, TILE * 2, (map.w - 2) * TILE);
  m.y = m.hy = clamp(P.y + Math.sin(a) * r, TILE * 2, (map.h - 2) * TILE);

function fleeUpdate(m, dt, dp){
  m.life -= dt;
  if(m.life <= 0){ m.dead = true; m.respawnT = 1e9; if(P.target === m) P.target = null; burst(m.x, m.y - 20, '#ffd76a', 20, 120); msg('寶藏哥布林鑽進傳送門逃走了……', '#9a9488'); return; }
  const spd = m.d.spd * (m.slowT > 0 ? 0.45 : 1);
  if(dp < 340 || m.aggro){
    let a = Math.atan2(m.y - P.y, m.x - P.x) + Math.sin(m.anim * 2) * 0.7;
    const cx = map.w * TILE / 2, cy = map.h * TILE / 2;
    if(m.x < 3 * TILE || m.x > (map.w - 3) * TILE || m.y < 3 * TILE || m.y > (map.h - 3) * TILE) a = Math.atan2(cy - m.y, cx - m.x) + (Math.random() - 0.5);
    m.moving = stepToward(m, m.x + Math.cos(a) * 80, m.y + Math.sin(a) * 80, spd, dt);
  }
  if(Math.random() < 0.15) parts.push({x:m.x + rand(-8, 8), y:m.y - rand(10, 30), vx:0, vy:-30, life:0.5, t:0, color:'#ffd76a', size:2, g:0});
}

let eprojs = [];
function enemyShot(m){
  const d = m.d, sx = m.x + m.face * 14, sy = m.y - d.h * 0.55, a = Math.atan2(P.y - 40 - sy, P.x - sx), sp = 300;
  eprojs.push({x:sx, y:sy, vx:Math.cos(a) * sp, vy:Math.sin(a) * sp, dmg:d.atk, life:2.2, color:d.pc || '#9cff5a', src:d.name, big:!!d.boss});
}
function eprojUpdate(dt){
  for(let i = eprojs.length - 1; i >= 0; i--){
    const p = eprojs[i]; p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt;
    if(Math.random() < 0.6) parts.push({x:p.x, y:p.y, vx:rand(-15, 15), vy:rand(-15, 15), life:0.3, t:0, color:p.color, size:p.big ? 5 : 3, g:0});
    if(!P.dead && Math.hypot(P.x - p.x, P.y - 40 - p.y) < (p.big ? 26 : 18)){ hitPlayer(p.dmg, p.src); burst(p.x, p.y, p.color, 10, 120); eprojs.splice(i, 1); continue; }
    if(p.life <= 0) eprojs.splice(i, 1);

}
function drawEprojs(){

  }
}

    case 'bacc': P.bounty = P.bountyOffer; P.bountyOffer = null; msg(`接受懸賞：討伐 ${MT[P.bounty.m].name} × ${P.bounty.n}`, '#f3dca0'); save(); openBounty(); return true;
    case 'bnew': if(poor(P.lv * 10)) return true; P.bountyOffer = bountyPick(); openBounty(); return true;
    case 'bdrop': P.bounty = null; save(); openBounty(); return true;
    case 'bclaim': {
      const B = P.bounty; P.gold += B.gold; gainExp(B.exp); P.bountyDone = (P.bountyDone || 0) + 1;
      if(P.bountyDone % 5 === 0){ const it = genItem(SLOT_ORDER[randi(0, 4)], MT[B.m].lv + 2, Math.max(2, rollQ(0.05))); if(P.inv.length < INV_MAX){ P.inv.push(it); msg(`懸賞額外獎勵：${it.name}`, QC[it.q]); } else P.gold += it.price; }

    }

}

const DECOSET = {
  snow:   {n:220, set:[['snowpine', 0.5], ['rock', 0.66], ['crystal', 0.8], ['deadtree', 1]], col:'#bfeaff'},
  grave:  {n:210, set:[['tomb', 0.35], ['cross', 0.5], ['deadtree', 0.72], ['rock', 0.82], ['gfence', 1]]},

    sc(M.w * M.h * 0.4, (x, y) => { c.fillStyle = 'rgba(110,70,30,.35)'; ell(c, x, y, 1.5 + R() * 2, 1 + R() * 1.5); c.fill(); });
    for(let i = 0; i < 7; i++){ const x0 = cw * (0.1 + R() * 0.7), y0 = ch * (0.15 + R() * 0.7);

  } else if(th === 'lair'){

  } else if(th === 'tower'){

    const cx = cw / 2, cy = ch / 2 - TILE;

}

      }

    }
    case 'tomb':

      break;
    case 'gfence':
      c.fillStyle = '#16161a';
      for(let k = -3; k <= 3; k++){ c.fillRect(k * 9 - 1.2, -30, 2.4, 30); c.beginPath(); c.moveTo(k * 9 - 3, -30); c.lineTo(k * 9, -37); c.lineTo(k * 9 + 3, -30); c.fill(); }

    case 'cactus': {
      const k = s * 1.2;
      c.fillStyle = 'rgba(90,60,20,.3)'; ell(c, 0, 0, 14 * k, 4 * k); c.fill();

      c.lineWidth = 6.5 * k; c.beginPath(); c.moveTo(0, -22 * k); c.lineTo(-12 * k, -22 * k); c.lineTo(-12 * k, -38 * k); c.moveTo(0, -30 * k); c.lineTo(11 * k, -30 * k); c.lineTo(11 * k, -42 * k); c.stroke();

    }
    case 'pillar': {
      const tw = mapId === 'tower', col = tw ? '#3e3e4a' : '#b8925e', hh = tw ? 70 : (30 + o.v * 40);
      c.fillStyle = 'rgba(0,0,0,.3)'; ell(c, 0, 0, 16 * s, 5 * s); c.fill();
      const g = c.createLinearGradient(-10 * s, 0, 10 * s, 0); g.addColorStop(0, shade(col, -35)); g.addColorStop(0.6, col); g.addColorStop(1, shade(col, 20));

    case 'goldpile': {
      c.fillStyle = 'rgba(0,0,0,.35)'; ell(c, 0, 0, 24 * s, 7 * s); c.fill();

  }
}

/* ================= 主迴圈 ================= */
let last = performance.now();
function loop(now){
  const dt = Math.min(0.05, (now - last) / 1000); last = now; gt += dt;
  if(running){
    update(dt); render();
    hudT -= dt; if(hudT <= 0){ hudT = 0.07; updateHUD(); }
  } else drawCards();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
addEventListener('beforeunload', save);
document.addEventListener('visibilitychange', () => { if(document.hidden) save(); });
