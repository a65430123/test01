<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Q萌英雄傳</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#121018;color:#fff;
  font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC","Noto Sans CJK TC",sans-serif;
  user-select:none;-webkit-user-select:none;touch-action:none}
canvas#game{position:fixed;inset:0;display:block}
.hidden{display:none!important}
button{font-family:inherit;cursor:pointer}
#ui{position:fixed;inset:0;pointer-events:none}
.box{background:rgba(22,16,32,.78);border:2px solid #c9a24a;border-radius:14px;box-shadow:0 4px 14px rgba(0,0,0,.45)}
#status{position:absolute;left:10px;top:10px;display:flex;gap:8px;padding:8px 10px;pointer-events:auto}
#portrait{width:58px;height:58px;border-radius:50%;background:radial-gradient(#5a4a78,#2a2038);border:2px solid #f0d27a}
#stName{font-weight:bold;font-size:14px;margin-bottom:3px;white-space:nowrap}
#stName .lv{color:#ffd76a;margin-right:4px}
.bar{width:170px;height:13px;background:#2a2230;border-radius:7px;position:relative;overflow:hidden;margin-top:3px;border:1px solid rgba(0,0,0,.6)}
.bar .fill{height:100%;transition:width .15s}
.bar span{position:absolute;inset:0;font-size:10px;line-height:12px;text-align:center;text-shadow:0 0 2px #000,0 0 2px #000}
.hp .fill{background:linear-gradient(#ff7a7a,#d22d2d)}
.mp .fill{background:linear-gradient(#7ab8ff,#2d5fd2)}
.ex .fill{background:linear-gradient(#ffe37a,#d2a02d)}
#stGold{font-size:12px;margin-top:4px;color:#ffd76a}
#stGold b{color:#ff9f6a;margin-left:8px}
#mapWrap{position:absolute;right:10px;top:10px;padding:6px;text-align:center;pointer-events:auto}
#mapName{font-size:13px;font-weight:bold;color:#ffe9a8;margin-bottom:4px}
#mini{display:block;border-radius:8px;background:#000}
#quest{position:absolute;right:10px;top:170px;width:170px;padding:8px 10px;font-size:12px;line-height:1.5}
#quest .qt{color:#ffd76a;font-weight:bold}
#quest .ok{color:#7dff8a}
#target{position:absolute;left:50%;top:10px;transform:translateX(-50%);padding:5px 14px;text-align:center;min-width:200px}
#target .nm{font-size:13px;font-weight:bold}
#target .bar{width:200px}
#log{position:absolute;left:10px;bottom:96px;width:min(340px,60vw);font-size:12px;line-height:1.55;text-shadow:0 0 3px #000,0 0 3px #000}
#log div{opacity:.95}
#skillbar{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:8px;padding:8px 10px;pointer-events:auto}
.sk{position:relative;width:56px;height:56px;border-radius:12px;border:2px solid #8a7040;background:linear-gradient(#4a3a5e,#2a2038);
  color:#fff;font-size:24px;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:manipulation}
.sk:active{transform:scale(.94)}
.sk .key{position:absolute;left:4px;top:1px;font-size:10px;color:#ffd76a}
.sk .cnt{position:absolute;right:4px;bottom:1px;font-size:11px;font-weight:bold;text-shadow:0 0 2px #000}
.sk .cdm{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.65);pointer-events:none}
.sk .cdt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:bold;text-shadow:0 0 3px #000;pointer-events:none}
.sk.lock{filter:grayscale(1);opacity:.55}
.sk .nm2{position:absolute;bottom:-1px;left:0;right:0;font-size:9px;text-align:center;color:#ddd;text-shadow:0 0 2px #000}
#side{position:absolute;right:10px;bottom:12px;display:flex;flex-direction:column;gap:8px;pointer-events:auto}
.sb{width:62px;height:46px;border-radius:12px;border:2px solid #c9a24a;background:linear-gradient(#6b4e2e,#3c2a18);color:#ffe9a8;font-size:13px;font-weight:bold;line-height:1.1;touch-action:manipulation}
.sb small{display:block;font-size:9px;color:#d8c08a;font-weight:normal}
.sb.on{background:linear-gradient(#3aa55a,#1e6a33);border-color:#9dff9d;color:#fff;box-shadow:0 0 12px #5f5}
#toast{position:absolute;left:50%;top:32%;transform:translateX(-50%);font-size:26px;font-weight:bold;color:#ffe066;
  text-shadow:0 0 6px #c60,0 0 2px #000;pointer-events:none;transition:opacity .4s;opacity:0;white-space:nowrap}
/* panels */
#panel{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(620px,94vw);max-height:86vh;display:flex;flex-direction:column;z-index:10}
#panel .ph{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid #6b5426;font-weight:bold;color:#ffe9a8;font-size:16px}
#panel .ph button{background:none;border:none;color:#ffb0b0;font-size:22px;line-height:1}
#panel .pb{padding:12px 14px;overflow:auto;font-size:13px;line-height:1.6}
.btn{background:linear-gradient(#e0b04a,#a87420);border:1px solid #ffe08a;color:#2a1a05;font-weight:bold;border-radius:8px;padding:5px 12px;margin:3px 4px 3px 0;font-size:13px}
.btn.g{background:linear-gradient(#6fd36f,#2e8a3a);color:#fff;border-color:#b8ffb8}
.btn.r{background:linear-gradient(#e86a6a,#a32a2a);color:#fff;border-color:#ffb8b8}
.btn:disabled{filter:grayscale(1);opacity:.5}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px dashed rgba(255,255,255,.12)}
.bag{display:flex;gap:12px;flex-wrap:wrap}
.eqcol{flex:1 1 200px}
.invcol{flex:2 1 280px}
.eqslots{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:6px 0}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.cell{position:relative;aspect-ratio:1;border-radius:8px;background:#1c1626;border:2px solid #3a3048;display:flex;align-items:center;justify-content:center;font-size:20px}
.cell.sel{outline:2px solid #fff}
.cell .en{position:absolute;right:2px;top:0;font-size:10px;color:#ffe066;font-weight:bold}
.cell .up{position:absolute;left:2px;bottom:0;font-size:10px;color:#6f6}
.cell .lab{position:absolute;bottom:0;font-size:9px;color:#998;}
.stats{font-size:12px;display:grid;grid-template-columns:1fr 1fr;gap:2px 10px;background:rgba(0,0,0,.25);padding:6px 8px;border-radius:8px}
.stats b{color:#ffd76a}
#detail{margin-top:8px;min-height:60px;background:rgba(0,0,0,.3);border-radius:8px;padding:8px;font-size:12px}
.npcsay{background:rgba(0,0,0,.3);border-radius:8px;padding:8px 10px;margin-bottom:8px;color:#f3e6c6}
/* start screen */
#start{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;
  background:radial-gradient(ellipse at 50% 30%,#3d2a5c 0%,#1a1226 60%,#0c0812 100%);z-index:20;overflow:auto;padding:16px}
#start h1{font-size:clamp(34px,7vw,60px);letter-spacing:4px;color:#ffe066;text-shadow:0 0 18px #ff8a00,0 4px 0 #8a3a00}
#start .sub{color:#d8c8ff;margin:6px 0 18px;font-size:14px}
.cards{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.card{width:170px;padding:10px;border-radius:14px;border:2px solid #5a4878;background:rgba(30,22,44,.85);text-align:center;cursor:pointer;transition:.15s}
.card:hover{transform:translateY(-3px)}
.card.sel{border-color:#ffd76a;box-shadow:0 0 18px rgba(255,215,106,.6)}
.card canvas{width:120px;height:120px}
.card h3{color:#ffe9a8;margin:4px 0}
.card p{font-size:12px;color:#cfc4e4;line-height:1.5;min-height:36px}
#start input{margin:16px 0 8px;padding:9px 12px;border-radius:10px;border:2px solid #c9a24a;background:#1c1626;color:#fff;font-size:16px;text-align:center;width:220px;font-family:inherit}
#start .help{margin-top:14px;font-size:12px;color:#a99cc4;text-align:center;line-height:1.7;max-width:560px}
#death{position:fixed;inset:0;background:rgba(60,0,0,.55);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:15}
#death h2{font-size:40px;color:#ff6a6a;text-shadow:0 0 10px #000}
#death p{margin:10px 0 18px;color:#ffd}
@media (max-width:640px){
  .bar{width:120px}
  #quest{top:150px;width:140px;font-size:11px}
  #mini{width:120px;height:90px}
  .sk{width:48px;height:48px;font-size:20px}
  #skillbar{gap:5px;padding:6px}
  #log{bottom:80px;font-size:11px}
  .sb{width:54px;height:42px;font-size:12px}
  #target{top:auto;bottom:84px}
  #side{bottom:84px}
}
</style>
</head>

<div id="start">
  <h1>Q萌英雄傳</h1>

let W = 0, H = 0, DPR = 1, ZOOM = 1;
function resize(){
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  cv.width = Math.floor(W * DPR); cv.height = Math.floor(H * DPR);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ZOOM = Math.min(W, H) < 560 ? 0.78 : 1;
}
addEventListener('resize', resize); resize();

function mulberry(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const PI2 = Math.PI * 2;
function rr(c, x, y, w, h, r){ c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
function ell(c, x, y, rx, ry){ c.beginPath(); c.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), 0, 0, PI2); }
function shade(hex, amt){
  let n = parseInt(hex.slice(1), 16);
  let r = clamp((n >> 16) + amt, 0, 255), g = clamp((n >> 8 & 255) + amt, 0, 255), b = clamp((n & 255) + amt, 0, 255);
  return '#' + ((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1);
}
function esc(s){ return String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])); }

function newPlayer(name, cls){
  const p = {name, cls, lv:1, exp:0, gold:60, hpPot:5, mpPot:5, inv:[], eq:{weapon:null, helmet:null, armor:null, boots:null, ring:null},
    quest:{i:0, c:0, acc:false}, map:'village', x:16 * TILE, y:13 * TILE, hp:0, mp:null, auto:false, kills:0};
  p.eq.weapon = genItem('weapon', 1, 0, cls);

function initRuntime(p){
  Object.assign(p, {target:null, moveTo:null, npcT:null, atkCd:0, scd:[0,0,0], potCd:0, atkAnim:0, walk:0, moving:false,
    face:1, manualT:0, buffT:0, dead:false, stuckT:0, autoWander:false, hitFlash:0, invFullWarn:0, autoT:0});

function stats(){
  const C = CLASSES[P.cls], L = P.lv - 1;
  let hp = C.hp + C.g.hp * L, mp = C.mp + C.g.mp * L, atk = C.atk + C.g.atk * L, def = C.def + C.g.def * L, crit = 5, spd = 0;
  for(const k of SLOT_ORDER){
    const it = P.eq[k]; if(!it) continue;
    const m = 1 + it.enh * 0.1;
    hp += it.hp * m; mp += it.mp * m; atk += it.atk * m; def += it.def * m; crit += it.crit; spd += it.spd;
  }
  if(P.buffT > 0) atk *= 1.5;
  return {maxHp:Math.round(hp), maxMp:Math.round(mp), atk:Math.round(atk), def:Math.round(def), crit:Math.min(60, Math.round(crit)), spd:150 * (1 + spd / 100), spdP:spd};
}
function power(s){ return Math.round(s.atk * 3 + s.def * 4 + s.maxHp / 4 + s.maxMp / 8 + s.crit * 5); }

/* ================= 裝備 ================= */
function genItem(slot, mlv, q, cls){
  const tier = clamp(Math.floor(mlv / 5), 0, 6);
  const pw = (4 + mlv * 1.6) * QM[q];
  const name = slot === 'weapon' ? WNAMES[cls || P.cls][tier] : NAMES[slot][tier];
  const it = {uid:uid(), slot, q, lv:Math.max(1, mlv - 2), enh:0, name, atk:0, def:0, hp:0, mp:0, crit:0, spd:0, cls:slot === 'weapon' ? (cls || P.cls) : null};
  if(slot === 'weapon') it.atk = Math.round(pw);
  if(slot === 'armor'){ it.def = Math.round(pw * 0.5); it.hp = Math.round(pw * 3); }
  if(slot === 'helmet'){ it.def = Math.round(pw * 0.35); it.hp = Math.round(pw * 1.5); }
  if(slot === 'boots'){ it.def = Math.round(pw * 0.25); it.spd = 4 + q * 3; }
  if(slot === 'ring'){ it.atk = Math.round(pw * 0.4); it.crit = 2 + q * 2; }
  for(let i = 1; i < q; i++){
    const r = Math.random();
    if(r < 0.35) it.hp += Math.round(pw * 1.8);
    else if(r < 0.6) it.mp += Math.round(pw * 1.2);
    else if(r < 0.8) it.crit += 1 + q;
    else it.atk += Math.round(pw * 0.25);
  }
  it.price = Math.round(pw * (q + 1) * 1.5);
  return it;
}
function rollQ(bonus){
  const r = Math.random() - (bonus || 0);
  return r < 0.012 ? 4 : r < 0.06 ? 3 : r < 0.18 ? 2 : r < 0.45 ? 1 : 0;
}
function itemPower(it){ if(!it) return 0; const m = 1 + it.enh * 0.1; return (it.atk * 3 + it.def * 4 + it.hp / 4 + it.mp / 8) * m + it.crit * 5 + it.spd * 3; }
function itemName(it){ return (it.enh ? '+' + it.enh + ' ' : '') + it.name; }
function itemIcon(it){ return it.slot === 'weapon' ? W_ICON[it.cls || P.cls] : SLOT_ICON[it.slot]; }
function itemHTML(it){
  const m = 1 + it.enh * 0.1, L = [];
  if(it.atk) L.push(`攻擊 +${Math.round(it.atk * m)}`);
  if(it.def) L.push(`防禦 +${Math.round(it.def * m)}`);
  if(it.hp) L.push(`生命 +${Math.round(it.hp * m)}`);
  if(it.mp) L.push(`魔力 +${Math.round(it.mp * m)}`);
  if(it.crit) L.push(`暴擊 +${it.crit}%`);
  if(it.spd) L.push(`移速 +${it.spd}%`);
  const wrong = it.slot === 'weapon' && it.cls && it.cls !== P.cls;
  return `<div style="color:${QC[it.q]};font-weight:bold;font-size:14px">${itemIcon(it)} ${esc(itemName(it))}</div>
    <div style="color:#bbb">${SLOTS[it.slot]} · ${QN[it.q]} · <span style="color:${P.lv < it.lv ? '#ff6a6a' : '#bbb'}">需求等級 ${it.lv}</span>${wrong ? ' · <span style="color:#ff6a6a">' + CLASSES[it.cls].name + '專用</span>' : ''}</div>
    <div style="color:#9fe">${L.join('　')}</div><div style="color:#ffd76a">售價 ${it.price} 金幣</div>`;
}
function canEquip(it){ return P.lv >= it.lv && !(it.slot === 'weapon' && it.cls && it.cls !== P.cls); }
function equip(i){
  const it = P.inv[i]; if(!it) return;
  if(!canEquip(it)){ msg('無法裝備：等級或職業不符', '#ff8a8a'); return; }
  const old = P.eq[it.slot]; P.eq[it.slot] = it; P.inv.splice(i, 1);
  if(old) P.inv.push(old);
  msg(`裝備了 ${itemName(it)}`, QC[it.q]); afterEquip();
}
function unequip(slot){
  const it = P.eq[slot]; if(!it) return;
  if(P.inv.length >= INV_MAX){ msg('背包已滿', '#ff8a8a'); return; }
  P.eq[slot] = null; P.inv.push(it); afterEquip();
}
function afterEquip(){ S = stats(); P.hp = Math.min(P.hp, S.maxHp); P.mp = Math.min(P.mp, S.maxMp); save(); }
function autoEquip(){
  let n = 0;
  for(const slot of SLOT_ORDER){
    let bi = -1, bp = itemPower(P.eq[slot]);
    P.inv.forEach((it, i) => { if(it.slot === slot && canEquip(it) && itemPower(it) > bp){ bp = itemPower(it); bi = i; } });
    if(bi >= 0){ const it = P.inv[bi]; const old = P.eq[slot]; P.eq[slot] = it; P.inv.splice(bi, 1); if(old) P.inv.push(old); n++; }
  }
  afterEquip();
  msg(n ? `一鍵換裝完成，更換了 ${n} 件裝備` : '目前已是最佳裝備', '#9fe');
}
function sellItem(i){
  const it = P.inv[i]; if(!it) return;
  P.inv.splice(i, 1); P.gold += it.price; msg(`出售 ${itemName(it)}，獲得 ${it.price} 金幣`, '#ffd76a'); save();
}
function sellBelow(q){
  let g = 0, n = 0;
  P.inv = P.inv.filter(it => { if(it.q <= q && it.enh === 0){ g += it.price; n++; return false; } return true; });
  P.gold += g; msg(n ? `出售 ${n} 件裝備，獲得 ${g} 金幣` : '沒有可出售的裝備', '#ffd76a'); save();
}

/* ================= 地圖生成 ================= */
function hashStr(s){ let h = 2166136261; for(const ch of s){ h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }

function buildMap(id){
  const M = MAPS[id];
  if(M.cache) return M.cache;
  const R = mulberry(hashStr(id) + 7);
  const th = THEMES[M.theme];
  const cw = M.w * TILE, ch = M.h * TILE;
  const g = document.createElement('canvas'); g.width = cw; g.height = ch;
  const c = g.getContext('2d');
  // 基礎地磚
  for(let y = 0; y < M.h; y++) for(let x = 0; x < M.w; x++){
    c.fillStyle = th.ground[Math.floor(R() * th.ground.length)];
    c.fillRect(x * TILE, y * TILE, TILE, TILE);
  }
  // 斑塊
  for(let i = 0; i < M.w * M.h * 0.5; i++){
    c.fillStyle = R() < 0.5 ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.06)';
    ell(c, R() * cw, R() * ch, 20 + R() * 50, 12 + R() * 30); c.fill();
  }
  const dec = [], sol = [];
  const avoid = [];
  for(const p of M.portals) avoid.push({x:p.x * TILE, y:p.y * TILE, r:TILE * 3});
  for(const n of (M.npcs || [])) avoid.push({x:n.x * TILE, y:n.y * TILE, r:TILE * 1.8});
  const free = (x, y, extra) => avoid.every(a => Math.hypot(a.x - x, a.y - y) > a.r + (extra || 0));

  const path = (pts, wdt, col, edge) => {
    c.lineCap = 'round'; c.lineJoin = 'round';
    c.strokeStyle = edge; c.lineWidth = wdt + 8; c.beginPath(); pts.forEach((p, i) => i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1])); c.stroke();
    c.strokeStyle = col; c.lineWidth = wdt; c.stroke();
  };

  if(M.theme === 'village' || M.theme === 'forest'){
    // 小草與花
    for(let i = 0; i < M.w * M.h * 1.2; i++){
      const x = R() * cw, y = R() * ch;
      c.strokeStyle = 'rgba(40,110,40,.55)'; c.lineWidth = 1.5;
      c.beginPath(); c.moveTo(x, y); c.lineTo(x - 2, y - 6); c.moveTo(x, y); c.lineTo(x + 2, y - 7); c.stroke();
    }
    for(let i = 0; i < M.w * M.h * 0.12; i++){
      const x = R() * cw, y = R() * ch, col = ['#fff','#ffe066','#ff8fb1','#a7c7ff'][Math.floor(R() * 4)];
      c.fillStyle = col; for(let k = 0; k < 5; k++){ c.beginPath(); c.arc(x + Math.cos(k * 1.256) * 3, y + Math.sin(k * 1.256) * 3, 2.2, 0, PI2); c.fill(); }
      c.fillStyle = '#f5b000'; c.beginPath(); c.arc(x, y, 1.6, 0, PI2); c.fill();
    }
  }
  if(M.theme === 'village'){
    path([[0, 12 * TILE], [cw, 12 * TILE]], 64, '#d9c08a', '#c4a870');
    path([[16 * TILE, 3 * TILE], [16 * TILE, 21 * TILE]], 50, '#d9c08a', '#c4a870');
    c.fillStyle = '#c4a870'; ell(c, 16 * TILE, 12.3 * TILE, 5.2 * TILE, 4.2 * TILE); c.fill();
    c.fillStyle = '#dcc690'; ell(c, 16 * TILE, 12.3 * TILE, 5 * TILE, 4 * TILE); c.fill();
    // 石板
    for(let i = 0; i < 70; i++){
      const a = R() * PI2, rd = Math.sqrt(R()) * 4.5 * TILE;
      c.fillStyle = 'rgba(160,130,90,.35)'; rr(c, 16 * TILE + Math.cos(a) * rd, 12.3 * TILE + Math.sin(a) * rd * 0.8, 14, 9, 3); c.fill();
    }
    avoid.push({x:16 * TILE, y:12.3 * TILE, r:5.6 * TILE});
    const houses = [[5, 7, '#c0392b'], [26.5, 7, '#2e6fc0'], [5, 19.5, '#8e44ad'], [26.5, 19.5, '#d35400'], [10.5, 4.5, '#16a085'], [21.5, 4.5, '#b7950b']];
    for(const [hx, hy, roof] of houses){
      dec.push({t:'house', x:hx * TILE, y:hy * TILE, roof});
      sol.push({x1:hx * TILE - 62, y1:hy * TILE - 50, x2:hx * TILE + 62, y2:hy * TILE + 4});
      avoid.push({x:hx * TILE, y:hy * TILE - 20, r:TILE * 2.2});
    }
    dec.push({t:'well', x:16 * TILE, y:11.4 * TILE});
    sol.push({x1:16 * TILE - 22, y1:11.4 * TILE - 16, x2:16 * TILE + 22, y2:11.4 * TILE + 4});
    for(let x = 0; x < M.w; x++) for(const y of [0.6, M.h - 0.3]){
      if(Math.abs(x - 16) < 2) continue;
      if(R() < 0.75) dec.push({t:'tree', x:(x + 0.5) * TILE + (R() - 0.5) * 16, y:y * TILE, s:0.9 + R() * 0.35, v:R()});
    }
    for(let y = 1; y < M.h; y++) for(const x of [0.5, M.w - 0.5]){
      if(Math.abs(y - 12) < 2) continue;
      if(R() < 0.75) dec.push({t:'tree', x:x * TILE, y:y * TILE + (R() - 0.5) * 16, s:0.9 + R() * 0.35, v:R()});
    }
    for(let i = 0; i < 26; i++){
      const x = (2 + R() * (M.w - 4)) * TILE, y = (2 + R() * (M.h - 4)) * TILE;
      if(Math.abs(y - 12 * TILE) < 60 || Math.abs(x - 16 * TILE) < 50 || !free(x, y, 10)) continue;
      dec.push({t:R() < 0.5 ? 'bush' : 'tree', x, y, s:0.8 + R() * 0.3, v:R()});
    }
    for(let i = 0; i < 8; i++){
      const x = (3 + R() * (M.w - 6)) * TILE, y = (3 + R() * (M.h - 6)) * TILE;
      if(Math.abs(y - 12 * TILE) < 60 || !free(x, y, 30)) continue;
      dec.push({t:'fence', x, y});
    }
  }
  if(M.theme === 'forest'){
    const trail = [];
    for(let x = 0; x <= M.w; x += 1) trail.push([x * TILE, (20 + Math.sin(x * 0.22) * 4 + Math.sin(x * 0.07) * 3) * TILE]);
    path(trail, 56, '#b8a06a', '#9f8a58');
    const onTrail = (x, y) => { const tx = x / TILE; const ty = 20 + Math.sin(tx * 0.22) * 4 + Math.sin(tx * 0.07) * 3; return Math.abs(y / TILE - ty) < 1.6; };
    for(let i = 0; i < 260; i++){
      const edge = R() < 0.45;
      let x, y;
      if(edge){ const side = Math.floor(R() * 4); x = side < 2 ? R() * cw : (side === 2 ? R() * 2 * TILE : cw - R() * 2 * TILE); y = side < 2 ? (side === 0 ? R() * 2 * TILE : ch - R() * 1.5 * TILE) : R() * ch; }
      else { x = R() * cw; y = R() * ch; }
      if(onTrail(x, y) || !free(x, y)) continue;
      const r = R();
      dec.push({t:r < 0.55 ? 'tree' : r < 0.72 ? 'pine' : r < 0.86 ? 'bush' : r < 0.94 ? 'rock' : 'shroom', x, y, s:0.85 + R() * 0.45, v:R()});
    }
  }
  if(M.theme === 'cave'){
    for(let i = 0; i < M.w * M.h * 0.7; i++){
      const x = R() * cw, y = R() * ch;
      c.fillStyle = R() < 0.5 ? 'rgba(90,85,105,.6)' : 'rgba(20,18,26,.5)';
      ell(c, x, y, 2 + R() * 4, 1.5 + R() * 3); c.fill();
    }
    c.strokeStyle = 'rgba(15,12,20,.6)'; c.lineWidth = 2;
    for(let i = 0; i < 60; i++){
      let x = R() * cw, y = R() * ch; c.beginPath(); c.moveTo(x, y);
      for(let k = 0; k < 4; k++){ x += (R() - 0.5) * 50; y += (R() - 0.5) * 30; c.lineTo(x, y); } c.stroke();
    }
    for(let i = 0; i < 40; i++){ // 骨頭
      const x = R() * cw, y = R() * ch, a = R() * Math.PI;
      c.save(); c.translate(x, y); c.rotate(a); c.fillStyle = 'rgba(230,225,210,.55)';
      c.fillRect(-7, -1.5, 14, 3); c.beginPath(); c.arc(-7, -2, 2.2, 0, PI2); c.arc(-7, 2, 2.2, 0, PI2); c.arc(7, -2, 2.2, 0, PI2); c.arc(7, 2, 2.2, 0, PI2); c.fill(); c.restore();
    }
    for(let i = 0; i < 230; i++){
      const edge = R() < 0.5;
      const x = edge ? (R() < 0.5 ? R() * 1.6 * TILE : cw - R() * 1.6 * TILE) : R() * cw;
      const y = edge ? R() * ch : (R() < 0.5 ? R() * 1.6 * TILE : ch - R() * 1.2 * TILE);
      const y2 = R() < 0.3 ? R() * ch : y, x2 = R() < 0.3 ? R() * cw : x;
      if(!free(x2, y2)) continue;
      const r = R();
      dec.push({t:r < 0.5 ? 'stalag' : r < 0.72 ? 'rock' : r < 0.92 ? 'crystal' : 'torch', x:x2, y:y2, s:0.8 + R() * 0.6, v:R()});
    }
  }
  if(M.theme === 'lava'){
    for(let i = 0; i < 7; i++){
      let x = R() * cw, y = R() * ch; const pts = [[x, y]];
      for(let k = 0; k < 8; k++){ x += (R() - 0.3) * 160; y += (R() - 0.5) * 120; pts.push([x, y]); }
      c.shadowColor = '#ff5a00'; c.shadowBlur = 20;
      path(pts, 18 + R() * 16, '#ff7a1a', '#7a1e05'); c.shadowBlur = 0;
      c.strokeStyle = '#ffd04a'; c.lineWidth = 4; c.beginPath(); pts.forEach((p, k) => k ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1])); c.stroke();
    }
    c.strokeStyle = 'rgba(255,90,20,.35)'; c.lineWidth = 1.5;
    for(let i = 0; i < 120; i++){
      let x = R() * cw, y = R() * ch; c.beginPath(); c.moveTo(x, y);
      for(let k = 0; k < 3; k++){ x += (R() - 0.5) * 40; y += (R() - 0.5) * 24; c.lineTo(x, y); } c.stroke();
    }
    // 魔王祭壇
    const ax = 0.88 * cw, ay = ch / 2;
    c.fillStyle = '#2a1512'; ell(c, ax, ay, 220, 150); c.fill();
    c.strokeStyle = '#ff3a1a'; c.lineWidth = 3; c.shadowColor = '#f00'; c.shadowBlur = 14;
    ell(c, ax, ay, 190, 125); c.stroke(); ell(c, ax, ay, 130, 85); c.stroke();
    for(let k = 0; k < 6; k++){ const a = k * PI2 / 6; c.beginPath(); c.moveTo(ax + Math.cos(a) * 130, ay + Math.sin(a) * 85); c.lineTo(ax + Math.cos(a + 2.094) * 130, ay + Math.sin(a + 2.094) * 85); c.stroke(); }
    c.shadowBlur = 0;
    avoid.push({x:ax, y:ay, r:230});
    for(let i = 0; i < 200; i++){
      const edge = R() < 0.5;
      let x = R() * cw, y = R() * ch;
      if(edge){ if(R() < 0.5) x = R() < 0.5 ? R() * 1.6 * TILE : cw - R() * 1.6 * TILE; else y = R() < 0.5 ? R() * 1.6 * TILE : ch - R() * 1.2 * TILE; }
      if(!free(x, y)) continue;
      const r = R();
      dec.push({t:r < 0.35 ? 'spike' : r < 0.6 ? 'deadtree' : r < 0.82 ? 'rock2' : 'vent', x, y, s:0.8 + R() * 0.5, v:R()});
    }
  }
  // 邊框
  const grd = c.createLinearGradient(0, 0, 0, 40);
  grd.addColorStop(0, 'rgba(0,0,0,.45)'); grd.addColorStop(1, 'rgba(0,0,0,0)');
  c.fillStyle = grd; c.fillRect(0, 0, cw, 40);
  dec.sort((a, b) => a.y - b.y);
  M.cache = {g, decos:dec, solids:sol};
  return M.cache;
}

function spawnPos(def, zone){
  const M = map;
  for(let tries = 0; tries < 60; tries++){
    const x = (zone[0] + Math.random() * (zone[1] - zone[0])) * M.w * TILE;
    const y = def.boss || def.elite ? M.h * TILE / 2 + rand(-40, 40) : rand(2.2, M.h - 2) * TILE;
    if(M.portals.some(p => Math.hypot(p.x * TILE - x, p.y * TILE - y) < TILE * 5)) continue;
    return {x, y};
  }
  return {x:M.w * TILE / 2, y:M.h * TILE / 2};
}
function makeMonster(type, zone){
  const d = MT[type], pos = spawnPos(d, zone);
  return {type, d, zone, x:pos.x, y:pos.y, hx:pos.x, hy:pos.y, hp:d.hp, cd:0, face:Math.random() < 0.5 ? 1 : -1, anim:Math.random() * 10,
    aggro:false, returning:false, dead:false, respawnT:0, hitFlash:0, slowT:0, stunT:0, wanderT:rand(0, 3), wx:pos.x, wy:pos.y, atkAnim:0, skillT:4, moving:false};
}

function loadMap(id, tx, ty, silent){
  mapId = id; map = MAPS[id];
  const cache = buildMap(id);
  decos = cache.decos; solids = cache.solids;
  monsters = []; drops = []; projs = []; fxs = []; timers = []; parts = [];
  for(const [type, n, a, b] of map.monsters) for(let i = 0; i < n; i++) monsters.push(makeMonster(type, [a, b]));
  npcs = (map.npcs || []).map(n => ({...n, x:n.x * TILE, y:n.y * TILE, face:1, walk:0}));
  P.map = id;
  if(tx != null){ P.x = tx * TILE; P.y = ty * TILE; }
  P.target = null; P.moveTo = null; P.npcT = null; P.portalLock = 0.6;
  snapCam();
  if(!silent){ toast(map.name); msg(`進入了【${map.name}】${map.lvTxt ? '（' + map.lvTxt + '）' : ''}`, '#9fe'); }
  save();
}

const logEl = $('log');
function msg(t, col){

  logEl.appendChild(d); while(logEl.children.length > 7) logEl.removeChild(logEl.firstChild);
}
let toastTO = 0;
function toast(t){ const el = $('toast'); el.textContent = t; el.style.opacity = 1; clearTimeout(toastTO); toastTO = setTimeout(() => el.style.opacity = 0, 1600); }
function ftext(x, y, txt, color, size, life){ texts.push({x, y, txt, color, size:size || 15, t:0, life:life || 0.9, vx:rand(-15, 15)}); }
function burst(x, y, color, n, spd, g){
  for(let i = 0; i < n; i++){ const a = Math.random() * PI2, v = rand(0.3, 1) * (spd || 120);
    parts.push({x, y, vx:Math.cos(a) * v, vy:Math.sin(a) * v - (g ? 60 : 0), life:rand(0.35, 0.8), t:0, color, size:rand(2, 4.5), g:g || 0}); }
}

/* ================= 戰鬥 ================= */
function calcDmg(raw, def){ return Math.max(1, Math.round(raw * rand(0.9, 1.1) * (50 / (50 + def)))); }
function hitMonster(m, raw){
  if(m.dead) return;
  const crit = Math.random() * 100 < S.crit;
  let dmg = calcDmg(raw * (crit ? 1.8 : 1), m.d.def);
  m.hp -= dmg; m.hitFlash = 0.12; m.aggro = true; m.returning = false;
  ftext(m.x + rand(-8, 8), m.y - m.d.h - 6, (crit ? '暴擊 ' : '') + dmg, crit ? '#ffdd33' : '#fff', crit ? 21 : 15);
  burst(m.x, m.y - m.d.size, crit ? '#ffe066' : '#ffffff', crit ? 8 : 4, 110);
  if(m.hp <= 0) killMonster(m);
}
function hitPlayer(raw, src){
  if(P.dead) return;
  const dmg = calcDmg(raw, S.def);
  P.hp -= dmg; P.hitFlash = 0.15;
  ftext(P.x + rand(-6, 6), P.y - 66, '-' + dmg, '#ff5a5a', 16);
  if(P.hp <= 0){ P.hp = 0; die(src); }
}
function killMonster(m){
  m.dead = true; m.hp = 0; m.respawnT = m.d.respawn || rand(7, 12);
  if(P.target === m) P.target = null;
  burst(m.x, m.y - m.d.size, m.d.color, m.d.boss ? 60 : 16, m.d.boss ? 260 : 140, 200);
  if(m.d.boss){ shake = 0.6; ring(m.x, m.y, 260, '#ff6a00', 0.9, 8); }
  const diff = P.lv - m.d.lv;
  const em = clamp(1 - (diff - 5) * 0.12, 0.15, 1.3);
  const exp = Math.max(1, Math.round(m.d.exp * em));
  gainExp(exp);
  ftext(m.x, m.y - m.d.h - 26, '+' + exp + ' 經驗', '#b98cff', 13, 1.2);
  P.kills++;
  // 掉落
  drops.push({k:'gold', x:m.x + rand(-10, 10), y:m.y + rand(-6, 6), amt:randi(m.d.gold[0], m.d.gold[1]), t:0});
  if(Math.random() < 0.12) drops.push({k:Math.random() < 0.6 ? 'hp' : 'mp', x:m.x + rand(-22, 22), y:m.y + rand(-12, 12), amt:1, t:0});
  const nItems = m.d.boss ? 4 : m.d.elite ? 2 : (Math.random() < 0.13 ? 1 : 0);
  for(let i = 0; i < nItems; i++){
    const slot = SLOT_ORDER[Math.floor(Math.random() * 5)];
    const q = m.d.boss ? Math.max(2, rollQ(0.08)) : m.d.elite ? Math.max(1, rollQ(0.05)) : rollQ(0);
    const it = genItem(slot, m.d.lv + randi(-1, 2), q);
    drops.push({k:'item', x:m.x + rand(-30, 30), y:m.y + rand(-16, 16), item:it, t:0});
    if(q >= 3) msg(`【${QN[q]}】${it.name} 掉落了！`, QC[q]);
  }
  // 任務
  const Q = QUESTS[P.quest.i];
  if(Q && P.quest.acc && Q.m === m.type && P.quest.c < Q.n){
    P.quest.c++;
    if(P.quest.c >= Q.n){ msg(`任務【${Q.t}】已完成，回村長處領獎！`, '#7dff8a'); toast('任務完成！'); }
  }
  if(m.d.boss) msg(`★ ${P.name} 擊敗了 ${m.d.name}！英雄之名響徹大陸！`, '#ff9f1c');
}
function gainExp(n){
  P.exp += n;
  let up = false;
  while(P.exp >= expNeed(P.lv)){ P.exp -= expNeed(P.lv); P.lv++; up = true;
    SKILLS[P.cls].forEach(sk => { if(sk.lv === P.lv) msg(`領悟了新技能【${sk.name}】！`, '#ffd76a'); });
  }
  if(up){
    S = stats(); P.hp = S.maxHp; P.mp = S.maxMp;
    toast(`等級提升！Lv ${P.lv}`); msg(`恭喜升到 ${P.lv} 級！`, '#ffe066');
    ring(P.x, P.y, 90, '#ffe066', 0.8, 6); burst(P.x, P.y - 30, '#ffe066', 30, 160, 100);
    buildSkillbar(); save();
  }
}
function die(src){
  P.dead = true; P.target = null; P.moveTo = null;
  $('deathMsg').textContent = `你被【${src || '未知敵人'}】擊敗了……回城復活會損失少量經驗。`;
  $('death').classList.remove('hidden');
  for(const m of monsters){ m.aggro = false; m.returning = true; }
}
function revive(){
  $('death').classList.add('hidden');
  P.dead = false; P.exp = Math.max(0, Math.floor(P.exp - expNeed(P.lv) * 0.05));
  S = stats(); P.hp = S.maxHp; P.mp = S.maxMp;
  loadMap('village', 16, 13);
  msg('你在晨曦村復活了', '#9fe');
}
function nearestMonster(maxD){
  let best = null, bd = maxD || 1e9;
  for(const m of monsters){ if(m.dead) continue; const d = dist(P, m); if(d < bd){ bd = d; best = m; } }
  return best;
}
function basicAttack(m){
  const C = CLASSES[P.cls];
  P.atkCd = C.cd; P.atkAnim = 1; P.face = m.x >= P.x ? 1 : -1;
  if(!C.proj){
    hitMonster(m, S.atk);
    fxs.push({k:'slash', x:P.x + P.face * 22, y:P.y - 26, f:P.face, t:0, life:0.2, color:'#fff'});
  } else {
    projs.push({x:P.x + P.face * 14, y:P.y - 28, tgt:m, speed:C.proj === 'arrow' ? 560 : 400, dmg:S.atk, kind:C.proj, color:C.proj === 'arrow' ? '#ffe9a8' : '#a9c8ff', homing:true, life:2, hit:new Set(), vx:0, vy:0, aoe:0});
  }
}
function useSkill(i, silent){
  if(!P || P.dead) return false;
  const sk = SKILLS[P.cls][i]; if(!sk) return false;
  if(P.lv < sk.lv){ if(!silent) msg(`【${sk.name}】需要等級 ${sk.lv}`, '#ff8a8a'); return false; }
  if(P.scd[i] > 0) return false;
  if(P.mp < sk.mp){ if(!silent) msg('魔力不足！', '#7ab8ff'); return false; }
  if(map.safe && sk.type !== 'buff'){ if(!silent) msg('安全區內無法使用攻擊技能', '#ff8a8a'); return false; }
  let tgt = P.target && !P.target.dead ? P.target : null;
  if(['proj', 'dash', 'fan', 'aoeTarget'].includes(sk.type)){
    if(!tgt || dist(P, tgt) > sk.range + tgt.d.size) tgt = nearestMonster(sk.range);
    if(!tgt){ if(!silent) msg('技能範圍內沒有目標', '#ff8a8a'); return false; }
    P.target = tgt; P.face = tgt.x >= P.x ? 1 : -1;
  }
  P.mp -= sk.mp; P.scd[i] = sk.cd; P.atkAnim = 1;
  ftext(P.x, P.y - 78, sk.name, sk.fx, 14, 0.8);
  const base = S.atk * sk.mult;
  switch(sk.type){
    case 'aoeSelf':
      ring(P.x, P.y - 10, sk.r, sk.fx, 0.45, 6);
      fxs.push({k:sk.slow ? 'frost' : 'spin', x:P.x, y:P.y - 14, r:sk.r, t:0, life:0.45, color:sk.fx});
      for(const m of monsters) if(!m.dead && dist(P, m) < sk.r + m.d.size){ hitMonster(m, base); if(sk.slow) m.slowT = sk.slow; }
      break;
    case 'dash': {
      const a = Math.atan2(tgt.y - P.y, tgt.x - P.x), dd = Math.max(0, dist(P, tgt) - tgt.d.size - 18);
      for(let k = 0; k < 8; k++) parts.push({x:P.x + Math.cos(a) * dd * k / 8, y:P.y - 20 + Math.sin(a) * dd * k / 8, vx:0, vy:-20, life:0.4, t:0, color:sk.fx, size:6, g:0});
      moveEnt(P, Math.cos(a) * dd, Math.sin(a) * dd);
      hitMonster(tgt, base); if(!tgt.dead) tgt.stunT = sk.stun;
      ring(tgt.x, tgt.y, 50, sk.fx, 0.3, 5); shake = 0.15;
      break;
    }
    case 'buff':
      P.buffT = sk.dur; P.hp = Math.min(S.maxHp, P.hp + S.maxHp * sk.heal);
      ring(P.x, P.y, 70, sk.fx, 0.6, 6); burst(P.x, P.y - 30, sk.fx, 24, 140, 80);
      ftext(P.x, P.y - 92, '攻擊力 +50%', '#ff9a6a', 13, 1.2);
      break;
    case 'proj':
      projs.push({x:P.x + P.face * 14, y:P.y - 28, tgt, speed:sk.speed, dmg:base, kind:sk.pierce ? 'pierce' : 'fireball', color:sk.fx,
        homing:!sk.pierce, pierce:!!sk.pierce, aoe:sk.aoe || 0, life:sk.pierce ? 0.9 : 2, hit:new Set(),
        vx:0, vy:0, ang:Math.atan2(tgt.y - 14 - (P.y - 28), tgt.x - P.x)});
      break;
    case 'fan': {
      const a0 = Math.atan2(tgt.y - 14 - (P.y - 28), tgt.x - P.x);
      for(let k = 0; k < sk.n; k++){
        const a = a0 + (k - (sk.n - 1) / 2) * 0.17;
        projs.push({x:P.x + P.face * 14, y:P.y - 28, tgt:null, speed:sk.speed, dmg:base, kind:'arrow', color:sk.fx, homing:false, pierce:false, aoe:0, life:0.7, hit:new Set(), ang:a, vx:Math.cos(a) * sk.speed, vy:Math.sin(a) * sk.speed});
      }
      break;
    }
    case 'aoeTarget': {
      const tx = tgt.x, ty = tgt.y;
      fxs.push({k:'zone', x:tx, y:ty, r:sk.r, t:0, life:0.3 + sk.hits * 0.28, color:sk.fx});
      for(let k = 0; k < sk.hits; k++){
        const ox = tx + rand(-sk.r * 0.6, sk.r * 0.6), oy = ty + rand(-sk.r * 0.4, sk.r * 0.4);
        after(0.1 + k * 0.28, () => fxs.push({k:P.cls === 'mage' ? 'meteor' : 'arrowfall', x:ox, y:oy, t:0, life:0.25, color:sk.fx}));
        after(0.35 + k * 0.28, () => {
          ring(ox, oy, 50, sk.fx, 0.35, 4); burst(ox, oy - 6, sk.fx, 10, 150, 120);
          for(const m of monsters) if(!m.dead && Math.hypot(m.x - tx, m.y - ty) < sk.r + m.d.size) hitMonster(m, base);
          if(P.cls === 'mage') shake = Math.max(shake, 0.1);
        });
      }
      break;
    }
  }
  return true;
}
function usePot(k, silent){
  if(!P || P.dead || P.potCd > 0) return;
  if(k === 'hp'){
    if(P.hpPot <= 0){ if(!silent) msg('沒有紅藥水了！去雜貨商購買吧', '#ff8a8a'); return; }
    if(P.hp >= S.maxHp) return;
    P.hpPot--; const v = Math.round(S.maxHp * 0.35 + 40); P.hp = Math.min(S.maxHp, P.hp + v); ftext(P.x, P.y - 70, '+' + v, '#6fff6f', 15);
  } else {
    if(P.mpPot <= 0){ if(!silent) msg('沒有藍藥水了！去雜貨商購買吧', '#ff8a8a'); return; }
    if(P.mp >= S.maxMp) return;
    P.mpPot--; const v = Math.round(S.maxMp * 0.4 + 25); P.mp = Math.min(S.maxMp, P.mp + v); ftext(P.x, P.y - 70, '+' + v, '#7ab8ff', 15);
  }
  P.potCd = 0.8; burst(P.x, P.y - 30, k === 'hp' ? '#ff7a7a' : '#7ab8ff', 10, 70, 60);
}
function toggleAuto(){
  P.auto = !P.auto; P.manualT = 0;
  msg(P.auto ? '開啟自動掛機：自動打怪、撿物、喝藥' : '關閉自動掛機', P.auto ? '#7dff8a' : '#ccc');
  if(P.auto && map.safe) msg('提示：安全區沒有怪物，請先前往野外地圖', '#ffd76a');
}
function goTown(){
  if(P.dead) return;
  if(mapId === 'village'){ msg('你已經在村莊裡了'); return; }
  ring(P.x, P.y, 60, '#9fe8ff', 0.6, 6); burst(P.x, P.y - 30, '#9fe8ff', 20, 120, 60);
  loadMap('village', 16, 13);
}

/* ================= 移動 / 碰撞 ================= */
function moveEnt(e, dx, dy){
  e.x = clamp(e.x + dx, TILE * 0.6, map.w * TILE - TILE * 0.6);
  e.y = clamp(e.y + dy, TILE * 0.9, map.h * TILE - TILE * 0.35);
  for(const s of solids){
    const r = 9;
    if(e.x > s.x1 - r && e.x < s.x2 + r && e.y > s.y1 - r && e.y < s.y2 + r){
      const pl = e.x - (s.x1 - r), pr = (s.x2 + r) - e.x, pt = e.y - (s.y1 - r), pb = (s.y2 + r) - e.y;
      const mn = Math.min(pl, pr, pt, pb);
      if(mn === pl) e.x = s.x1 - r; else if(mn === pr) e.x = s.x2 + r; else if(mn === pt) e.y = s.y1 - r; else e.y = s.y2 + r;
    }
  }
}
function stepToward(e, tx, ty, spd, dt){
  const dx = tx - e.x, dy = ty - e.y, d = Math.hypot(dx, dy);
  if(d < 1) return false;
  const st = Math.min(d, spd * dt);
  moveEnt(e, dx / d * st, dy / d * st);
  if(Math.abs(dx) > 2) e.face = dx > 0 ? 1 : -1;
  return true;
}

/* ================= 更新 ================= */
function update(dt){
  S = stats();
  updatePlayer(dt);
  updateMonsters(dt);
  updateProjs(dt);
  for(let i = timers.length - 1; i >= 0; i--){ const t = timers[i]; t.t -= dt; if(t.t <= 0){ timers.splice(i, 1); t.fn(); } }
  for(let i = fxs.length - 1; i >= 0; i--){ const f = fxs[i]; f.t += dt; if(f.t >= f.life){ fxs.splice(i, 1); if(f.end) f.end(); } }
  for(let i = parts.length - 1; i >= 0; i--){ const p = parts[i]; p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.g * dt; p.vx *= 0.96; if(p.t >= p.life) parts.splice(i, 1); }
  for(let i = texts.length - 1; i >= 0; i--){ const t = texts[i]; t.t += dt; t.y -= 38 * dt; t.x += t.vx * dt; if(t.t >= t.life) texts.splice(i, 1); }
  for(const d of drops) d.t += dt;
  for(const n of npcs) n.walk += dt;
  // 環境粒子
  if(map.theme === 'lava' && Math.random() < dt * 14){ parts.push({x:cam.x + Math.random() * W / ZOOM, y:cam.y + H / ZOOM + 10, vx:rand(-10, 10), vy:rand(-60, -30), life:rand(2, 4), t:0, color:'#ff8a3d', size:rand(1.5, 3), g:0}); }
  if(map.theme === 'forest' && Math.random() < dt * 3){ parts.push({x:cam.x + Math.random() * W / ZOOM, y:cam.y + Math.random() * H / ZOOM, vx:rand(-8, 8), vy:rand(-12, -4), life:rand(2, 4), t:0, color:'#f6ff9a', size:2, g:0, glow:true}); }
  if(shake > 0) shake -= dt;
  updateCam(dt);
  saveT -= dt; if(saveT <= 0){ saveT = 10; save(); }
}

function updatePlayer(dt){
  P.atkCd -= dt; P.potCd -= dt; P.buffT -= dt; P.hitFlash -= dt; P.portalLock -= dt; P.invFullWarn -= dt;
  for(let i = 0; i < 3; i++) P.scd[i] = Math.max(0, P.scd[i] - dt);
  P.atkAnim = Math.max(0, P.atkAnim - dt * 4);
  if(P.dead){ P.moving = false; return; }
  // 回復
  const inCombat = monsters.some(m => m.aggro && !m.dead);
  const rg = map.safe ? 0.06 : inCombat ? 0.004 : 0.015;
  P.hp = Math.min(S.maxHp, P.hp + S.maxHp * rg * dt);
  P.mp = Math.min(S.maxMp, P.mp + S.maxMp * (rg + 0.006) * dt);

  let mx = 0, my = 0, moving = false;
  if(keys.w || keys.arrowup) my--; if(keys.s || keys.arrowdown) my++;
  if(keys.a || keys.arrowleft) mx--; if(keys.d || keys.arrowright) mx++;
  const ox = P.x, oy = P.y;
  if(mx || my){
    P.target = null; P.moveTo = null; P.npcT = null; P.manualT = 2.5;
    const l = Math.hypot(mx, my); moveEnt(P, mx / l * S.spd * dt, my / l * S.spd * dt); moving = true;
    if(mx) P.face = mx > 0 ? 1 : -1;
  } else {
    if(P.manualT > 0) P.manualT -= dt;
    if(P.auto && P.manualT <= 0){
      if(P.hp < S.maxHp * 0.45) usePot('hp', true);
      if(P.mp < S.maxMp * 0.25) usePot('mp', true);
      P.autoT -= dt;
      if((!P.target && !P.npcT && (!P.moveTo || (P.autoWander && P.autoT <= 0)))){ P.autoT = 0.8; autoThink(); }
      if(P.target && !P.target.dead){
        const dT = dist(P, P.target);
        SKILLS[P.cls].forEach((sk, i) => {
          if(P.scd[i] > 0 || P.lv < sk.lv || P.mp < sk.mp) return;
          if(sk.type === 'aoeSelf' && dT > sk.r * 0.8) return;
          if(sk.type === 'buff' && dT > 260) return;
          if(sk.range && dT > sk.range) return;
          useSkill(i, true);
        });
      }
    }
    if(P.target){
      const m = P.target;
      if(m.dead || map.safe) P.target = null;
      else {
        const d = dist(P, m), range = CLASSES[P.cls].range + m.d.size * 0.6;
        if(d > range) moving = stepToward(P, m.x, m.y, S.spd, dt);
        else { P.face = m.x >= P.x ? 1 : -1; if(P.atkCd <= 0) basicAttack(m); }
      }
    } else if(P.npcT){
      const n = P.npcT;
      if(Math.hypot(n.x - P.x, n.y - P.y) < 58){ P.npcT = null; openNpc(n.id); }
      else moving = stepToward(P, n.x, n.y, S.spd, dt);
    } else if(P.moveTo){
      if(Math.hypot(P.moveTo.x - P.x, P.moveTo.y - P.y) < 4){ P.moveTo = null; P.autoWander = false; }
      else moving = stepToward(P, P.moveTo.x, P.moveTo.y, S.spd, dt);
    }
    // 卡住偵測
    if(moving && Math.hypot(P.x - ox, P.y - oy) < S.spd * dt * 0.25){ P.stuckT += dt; if(P.stuckT > 0.5){ P.moveTo = null; P.stuckT = 0; P.autoWander = false; } }
    else P.stuckT = 0;
  }

    if(Math.hypot(p.x * TILE - P.x, p.y * TILE - P.y) < 30){ loadMap(p.to, p.tx, p.ty); return; }
  }
  // 撿取
  for(let i = drops.length - 1; i >= 0; i--){
    const d = drops[i]; if(d.t < 0.35) continue;
    if(Math.hypot(d.x - P.x, d.y - P.y) < (d.k === 'gold' ? 46 : 34)){
      if(d.k === 'gold'){ P.gold += d.amt; ftext(d.x, d.y - 20, '+' + d.amt + ' 金', '#ffd76a', 13); }
      else if(d.k === 'hp'){ P.hpPot++; ftext(d.x, d.y - 20, '紅藥水 +1', '#ff8a8a', 13); }
      else if(d.k === 'mp'){ P.mpPot++; ftext(d.x, d.y - 20, '藍藥水 +1', '#8ab8ff', 13); }
      else {
        if(P.inv.length >= INV_MAX){ if(P.invFullWarn <= 0){ msg('背包已滿！請出售裝備', '#ff8a8a'); P.invFullWarn = 5; } continue; }

}
function autoThink(){
  P.autoWander = false;
  let best = null, bd = 280;
  for(const d of drops){ if(d.k === 'item' && P.inv.length >= INV_MAX) continue; const dd = dist(P, d); if(dd < bd){ bd = dd; best = d; } }
  if(best){ P.moveTo = {x:best.x, y:best.y}; return; }
  if(map.safe) return;
  let tm = null; bd = 1e9;
  for(const m of monsters){
    if(m.dead) continue;
    if((m.d.boss || m.d.elite) && P.lv < m.d.lv - 2 && !m.aggro) continue;
    let d = dist(P, m); if(m.aggro) d *= 0.4;
    if(d < bd){ bd = d; tm = m; }
  }
  if(tm && bd < 900){ P.target = tm; return; }
  P.moveTo = {x:rand(3, map.w - 3) * TILE, y:rand(3, map.h - 3) * TILE}; P.autoWander = true;
}

function updateMonsters(dt){
  for(const m of monsters){
    const d = m.d;
    if(m.dead){
      m.respawnT -= dt;
      if(m.respawnT <= 0){ const pos = spawnPos(d, m.zone); Object.assign(m, {dead:false, hp:d.hp, x:pos.x, y:pos.y, hx:pos.x, hy:pos.y, aggro:false, returning:false, slowT:0, stunT:0}); burst(m.x, m.y - 10, '#fff', 8, 60); }
      continue;
    }
    m.anim += dt; m.cd -= dt; m.hitFlash -= dt; m.slowT -= dt; m.stunT -= dt; m.atkAnim = Math.max(0, m.atkAnim - dt * 4);
    m.moving = false;
    if(m.stunT > 0) continue;
    const spd = d.spd * (m.slowT > 0 ? 0.45 : 1);
    const dp = dist(m, P);
    if(!P.dead && !map.safe && !m.aggro && !m.returning && !d.passive && dp < (d.boss ? 280 : 165)) m.aggro = true;
    if(P.dead) m.aggro = false;
    if(m.aggro){
      if(Math.hypot(m.x - m.hx, m.y - m.hy) > (d.boss ? 520 : 430)){ m.aggro = false; m.returning = true; }
      else {
        const ar = d.size + 18;
        if(dp > ar){ m.moving = stepToward(m, P.x, P.y, spd, dt); }
        else { m.face = P.x >= m.x ? 1 : -1; if(m.cd <= 0){ m.cd = d.boss ? 1.3 : 1.4; m.atkAnim = 1; hitPlayer(d.atk, d.name); } }
        if(d.elite){
          m.skillT -= dt;
          if(m.skillT <= 0 && dp < 420){
            m.skillT = d.boss ? 4.5 : 6;
            const tx = P.x, ty = P.y, r = d.boss ? 105 : 80, col = d.boss ? '#ff3a1a' : '#9cff5a';
            fxs.push({k:'warn', x:tx, y:ty, r, t:0, life:1.1, color:col});
            after(1.1, () => {
              ring(tx, ty, r, col, 0.4, 7); burst(tx, ty, col, 24, 200, 100); shake = Math.max(shake, 0.2);
              if(!m.dead && Math.hypot(P.x - tx, P.y - ty) < r){ hitPlayer(d.atk * 1.7, d.name); }
            });
          }
        }
      }
    } else if(m.returning){
      m.moving = stepToward(m, m.hx, m.hy, spd * 1.6, dt);
      m.hp = Math.min(d.hp, m.hp + d.hp * 0.25 * dt);
      if(Math.hypot(m.x - m.hx, m.y - m.hy) < 6) m.returning = false;
    } else {
      m.wanderT -= dt;
      if(m.wanderT <= 0){ m.wanderT = rand(2, 5); const a = Math.random() * PI2, r = rand(0, 110); m.wx = m.hx + Math.cos(a) * r; m.wy = m.hy + Math.sin(a) * r; }
      if(Math.hypot(m.wx - m.x, m.wy - m.y) > 4) m.moving = stepToward(m, m.wx, m.wy, spd * 0.4, dt);
    }
  }
  // 分離
  for(let i = 0; i < monsters.length; i++){
    const a = monsters[i]; if(a.dead) continue;
    for(let j = i + 1; j < monsters.length; j++){
      const b = monsters[j]; if(b.dead) continue;
      const dx = b.x - a.x, dy = b.y - a.y, md = (a.d.size + b.d.size) * 0.8, dd = dx * dx + dy * dy;
      if(dd < md * md && dd > 0.01){ const d0 = Math.sqrt(dd), push = (md - d0) * 0.25, nx = dx / d0, ny = dy / d0;
        a.x -= nx * push; a.y -= ny * push; b.x += nx * push; b.y += ny * push; }
    }
  }
}
function updateProjs(dt){
  for(let i = projs.length - 1; i >= 0; i--){
    const p = projs[i];
    p.life -= dt;
    if(p.homing && p.tgt && !p.tgt.dead){
      const a = Math.atan2(p.tgt.y - p.tgt.d.size - p.y, p.tgt.x - p.x); p.ang = a;
      p.vx = Math.cos(a) * p.speed; p.vy = Math.sin(a) * p.speed;
    } else if(p.vx === 0 && p.vy === 0){ p.vx = Math.cos(p.ang || 0) * p.speed; p.vy = Math.sin(p.ang || 0) * p.speed; }
    else if(p.homing){ p.homing = false; p.life = Math.min(p.life, 0.4); }
    p.x += p.vx * dt; p.y += p.vy * dt;
    if(p.kind === 'fireball' || p.kind === 'bolt') parts.push({x:p.x, y:p.y, vx:rand(-20, 20), vy:rand(-20, 20), life:0.25, t:0, color:p.color, size:p.kind === 'fireball' ? 5 : 3, g:0});
    let remove = p.life <= 0;
    for(const m of monsters){
      if(m.dead || p.hit.has(m)) continue;
      if(Math.hypot(m.x - p.x, m.y - m.d.size - p.y) < m.d.size + 10){
        if(p.aoe){
          ring(p.x, p.y, p.aoe, p.color, 0.35, 5); burst(p.x, p.y, p.color, 16, 160);
          for(const o of monsters) if(!o.dead && Math.hypot(o.x - p.x, o.y - o.d.size - p.y) < p.aoe + o.d.size) hitMonster(o, p.dmg);
          remove = true; break;
        }
        hitMonster(m, p.dmg); p.hit.add(m);
        if(!p.pierce){ remove = true; break; }
      }
    }
    if(remove) projs.splice(i, 1);
  }
}

function viewW(){ return W / ZOOM; } function viewH(){ return H / ZOOM; }
function camTarget(){
  const vw = viewW(), vh = viewH(), mw = map.w * TILE, mh = map.h * TILE;
  return {x:mw <= vw ? (mw - vw) / 2 : clamp(P.x - vw / 2, 0, mw - vw), y:mh <= vh ? (mh - vh) / 2 : clamp(P.y - 30 - vh / 2, 0, mh - vh)};
}
function snapCam(){ const t = camTarget(); cam.x = t.x; cam.y = t.y; }
function updateCam(dt){ const t = camTarget(); const k = 1 - Math.exp(-dt * 8); cam.x += (t.x - cam.x) * k; cam.y += (t.y - cam.y) * k; }

function drawPortal(p){
  const c = ctx, x = p.x * TILE, y = p.y * TILE;
  c.save(); c.translate(x, y);
  const g = c.createRadialGradient(0, -6, 4, 0, -6, 34);
  g.addColorStop(0, 'rgba(255,255,255,.95)'); g.addColorStop(0.4, 'rgba(120,220,255,.7)'); g.addColorStop(1, 'rgba(80,60,255,0)');
  c.fillStyle = g; ell(c, 0, -6, 34, 22); c.fill();
  c.strokeStyle = '#9fe8ff'; c.lineWidth = 2;
  for(let k = 0; k < 3; k++){ c.beginPath(); c.ellipse(0, -6, 26 - k * 7, 16 - k * 4, 0, gt * (2 + k) , gt * (2 + k) + 4); c.stroke(); }
  for(let k = 0; k < 6; k++){ const a = gt * 2 + k * 1.05; c.fillStyle = '#d0f6ff'; c.beginPath(); c.arc(Math.cos(a) * 28, -6 + Math.sin(a) * 16 - Math.sin(gt * 3 + k) * 6, 2, 0, PI2); c.fill(); }

}

    c.fillStyle = col; c.fillRect(-7, -4, 14, 2.5);

function render(){
  const th = THEMES[map.theme];
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = th.bg; ctx.fillRect(0, 0, W, H);
  let sx = 0, sy = 0; if(shake > 0){ sx = rand(-4, 4); sy = rand(-4, 4); }
  ctx.setTransform(DPR * ZOOM, 0, 0, DPR * ZOOM, (-cam.x * ZOOM + sx) * DPR, (-cam.y * ZOOM + sy) * DPR);
  const vx0 = cam.x - 80, vy0 = cam.y - 40, vx1 = cam.x + viewW() + 80, vy1 = cam.y + viewH() + 160;
  ctx.drawImage(map.cache.g, 0, 0);
  if(map.theme === 'lava'){ ctx.globalAlpha = 0.08 + Math.sin(gt * 2) * 0.05; ctx.fillStyle = '#ff4a00'; ctx.fillRect(cam.x, cam.y, viewW(), viewH()); ctx.globalAlpha = 1; }
  for(const p of map.portals) drawPortal(p);
  // 地面效果
  for(const f of fxs){
    const k = f.t / f.life;
    if(f.k === 'warn'){ ctx.fillStyle = f.color; ctx.globalAlpha = 0.15 + k * 0.25; ell(ctx, f.x, f.y, f.r, f.r * 0.55); ctx.fill(); ctx.globalAlpha = 0.9; ctx.strokeStyle = f.color; ctx.lineWidth = 2; ell(ctx, f.x, f.y, f.r * k, f.r * 0.55 * k); ctx.stroke(); ell(ctx, f.x, f.y, f.r, f.r * 0.55); ctx.stroke(); ctx.globalAlpha = 1; }
    if(f.k === 'zone'){ ctx.globalAlpha = 0.25 * (1 - k * 0.5); ctx.fillStyle = f.color; ell(ctx, f.x, f.y, f.r, f.r * 0.55); ctx.fill(); ctx.globalAlpha = 1; }
  }
  if(P.target && !P.target.dead){ const m = P.target; ctx.strokeStyle = '#ff4a4a'; ctx.lineWidth = 2.5; ctx.setLineDash([6, 4]); ctx.lineDashOffset = -gt * 20; ell(ctx, m.x, m.y, m.d.size + 8, (m.d.size + 8) * 0.4); ctx.stroke(); ctx.setLineDash([]); }
  if(P.moveTo && !P.autoWander){ ctx.strokeStyle = 'rgba(140,255,180,.8)'; ctx.lineWidth = 2; const r = 6 + Math.sin(gt * 8) * 2; ell(ctx, P.moveTo.x, P.moveTo.y, r * 1.6, r * 0.7); ctx.stroke(); }
  for(const d of drops) if(d.x > vx0 && d.x < vx1 && d.y > vy0 && d.y < vy1) drawDrop(d);
  // y 排序
  const list = [];
  for(const o of decos) if(o.x > vx0 - 60 && o.x < vx1 + 60 && o.y > vy0 && o.y < vy1 + 40) list.push([o.y, 0, o]);
  for(const m of monsters) if(!m.dead && m.x > vx0 && m.x < vx1 && m.y > vy0 && m.y < vy1 + 80) list.push([m.y, 1, m]);
  for(const n of npcs) list.push([n.y, 2, n]);
  list.push([P.y, 3, P]);
  list.sort((a, b) => a[0] - b[0]);
  for(const [, k, o] of list){
    if(k === 0) drawDeco(o);
    else if(k === 1) drawMonster(o);
    else if(k === 2) drawNpc(o);
    else drawPlayer();
  }
  for(const m of monsters) if(!m.dead && m.x > vx0 && m.x < vx1 && m.y > vy0 && m.y < vy1 + 80) drawMonsterUI(m);
  // 投射物
  for(const p of projs){
    ctx.save(); ctx.translate(p.x, p.y);
    const a = Math.atan2(p.vy, p.vx); ctx.rotate(a);
    if(p.kind === 'arrow' || p.kind === 'pierce'){
      if(p.kind === 'pierce'){ ctx.shadowColor = p.color; ctx.shadowBlur = 12; ctx.strokeStyle = p.color; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(-30, 0); ctx.lineTo(0, 0); ctx.stroke(); }
      ctx.fillStyle = '#8b5a2b'; ctx.fillRect(-14, -1, 16, 2); ctx.fillStyle = '#ddd'; ctx.beginPath(); ctx.moveTo(6, 0); ctx.lineTo(0, -3.5); ctx.lineTo(0, 3.5); ctx.fill();
      ctx.fillStyle = p.kind === 'pierce' ? p.color : '#fff'; ctx.fillRect(-16, -3, 4, 6);
    } else {
      ctx.shadowColor = p.color; ctx.shadowBlur = 16; ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(0, 0, p.kind === 'fireball' ? 9 : 6, 0, PI2); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, 0, p.kind === 'fireball' ? 4 : 3, 0, PI2); ctx.fill();
    }
    ctx.restore();
  }
  // 特效
  for(const f of fxs){
    const k = f.t / f.life;
    if(f.k === 'ring'){ ctx.globalAlpha = 1 - k; ctx.strokeStyle = f.color; ctx.lineWidth = f.w * (1 - k) + 1; ell(ctx, f.x, f.y, f.r * (0.3 + k * 0.7), f.r * 0.55 * (0.3 + k * 0.7)); ctx.stroke(); ctx.globalAlpha = 1; }
    else if(f.k === 'slash'){ ctx.save(); ctx.translate(f.x, f.y); ctx.scale(f.f, 1); ctx.globalAlpha = 1 - k; ctx.strokeStyle = '#fff'; ctx.lineWidth = 4 * (1 - k) + 1; ctx.beginPath(); ctx.arc(-10, 4, 26, -1.4 + k * 0.6, 0.9 + k * 0.6); ctx.stroke(); ctx.restore(); ctx.globalAlpha = 1; }
    else if(f.k === 'spin'){ ctx.save(); ctx.translate(f.x, f.y); ctx.scale(1, 0.55); ctx.rotate(k * 9); ctx.globalAlpha = 1 - k; ctx.strokeStyle = f.color; ctx.lineWidth = 8;
      for(let q = 0; q < 3; q++){ ctx.beginPath(); ctx.arc(0, 0, f.r * (0.5 + q * 0.2), q * 2.1, q * 2.1 + 1.5); ctx.stroke(); } ctx.restore(); ctx.globalAlpha = 1; }
    else if(f.k === 'frost'){ ctx.save(); ctx.translate(f.x, f.y); ctx.globalAlpha = 1 - k; ctx.fillStyle = f.color;
      for(let q = 0; q < 12; q++){ const a = q * PI2 / 12, rd = f.r * (0.2 + k * 0.8); ctx.save(); ctx.translate(Math.cos(a) * rd, Math.sin(a) * rd * 0.55); ctx.rotate(a); ctx.beginPath(); ctx.moveTo(10, 0); ctx.lineTo(0, -4); ctx.lineTo(-6, 0); ctx.lineTo(0, 4); ctx.closePath(); ctx.fill(); ctx.restore(); }
      ctx.restore(); ctx.globalAlpha = 1; }
    else if(f.k === 'meteor' || f.k === 'arrowfall'){
      const sx0 = f.x + 90, sy0 = f.y - 260, cx = sx0 + (f.x - sx0) * k, cy = sy0 + (f.y - sy0) * k;
      if(f.k === 'meteor'){ ctx.shadowColor = '#ff5a00'; ctx.shadowBlur = 20; ctx.strokeStyle = 'rgba(255,160,60,.6)'; ctx.lineWidth = 10; ctx.beginPath(); ctx.moveTo(cx + 30, cy - 80); ctx.lineTo(cx, cy); ctx.stroke(); ctx.fillStyle = '#ffd04a'; ctx.beginPath(); ctx.arc(cx, cy, 11, 0, PI2); ctx.fill(); ctx.shadowBlur = 0; }
      else { ctx.strokeStyle = f.color; ctx.lineWidth = 2; for(let q = -2; q <= 2; q++){ ctx.beginPath(); ctx.moveTo(cx + q * 14 + 12, cy - 30 + Math.abs(q) * 5); ctx.lineTo(cx + q * 14, cy + Math.abs(q) * 5); ctx.stroke(); } }
    }
  }
  // 粒子
  for(const p of parts){
    const a = 1 - p.t / p.life; ctx.globalAlpha = a; ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.5 + a * 0.5), 0, PI2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  // 黑暗
  if(th.dark){
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const px = (P.x - cam.x) * ZOOM, py = (P.y - 30 - cam.y) * ZOOM;
    const g = ctx.createRadialGradient(px, py, 90 * ZOOM, px, py, Math.max(W, H) * 0.75);
    g.addColorStop(0, 'rgba(5,0,15,0)'); g.addColorStop(1, `rgba(5,0,15,${th.dark})`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.setTransform(DPR * ZOOM, 0, 0, DPR * ZOOM, (-cam.x * ZOOM + sx) * DPR, (-cam.y * ZOOM + sy) * DPR);
  }
  // 文字
  ctx.textAlign = 'center';
  for(const t of texts){
    const k = t.t / t.life, sc = k < 0.15 ? 0.6 + k / 0.15 * 0.6 : 1.2 - Math.min(0.2, (k - 0.15));
    ctx.globalAlpha = k > 0.7 ? (1 - k) / 0.3 : 1;
    ctx.font = `bold ${Math.round(t.size * sc)}px sans-serif`;
    ctx.lineWidth = 3.5; ctx.strokeStyle = 'rgba(0,0,0,.85)'; ctx.strokeText(t.txt, t.x, t.y); ctx.fillStyle = t.color; ctx.fillText(t.txt, t.x, t.y);
  }
  ctx.globalAlpha = 1;
}
function drawPlayer(){

}
function drawMini(){
  const mw = mini.width, mh = mini.height, sc = Math.min(mw / (map.w * TILE), mh / (map.h * TILE));
  const ox = (mw - map.w * TILE * sc) / 2, oy = (mh - map.h * TILE * sc) / 2;
  mctx.fillStyle = '#000'; mctx.fillRect(0, 0, mw, mh);
  mctx.drawImage(map.cache.g, ox, oy, map.w * TILE * sc, map.h * TILE * sc);
  mctx.fillStyle = 'rgba(0,0,0,.25)'; mctx.fillRect(0, 0, mw, mh);
  for(const p of map.portals){ mctx.fillStyle = '#5fe8ff'; mctx.beginPath(); mctx.arc(ox + p.x * TILE * sc, oy + p.y * TILE * sc, 3.5, 0, PI2); mctx.fill(); }
  for(const n of npcs){ mctx.fillStyle = '#ffe066'; mctx.beginPath(); mctx.arc(ox + n.x * sc, oy + n.y * sc, 2.5, 0, PI2); mctx.fill(); }
  for(const m of monsters){ if(m.dead) continue; mctx.fillStyle = m.d.boss || m.d.elite ? '#ff9f1c' : '#ff4a4a'; const r = m.d.boss || m.d.elite ? 4 : 1.8; mctx.fillRect(ox + m.x * sc - r / 2, oy + m.y * sc - r / 2, r, r); }
  mctx.fillStyle = '#fff'; mctx.strokeStyle = '#000'; mctx.lineWidth = 1; mctx.beginPath(); mctx.arc(ox + P.x * sc, oy + P.y * sc, 3.5, 0, PI2); mctx.fill(); mctx.stroke();
  mctx.strokeStyle = 'rgba(255,255,255,.5)'; mctx.strokeRect(ox + cam.x * sc, oy + cam.y * sc, viewW() * sc, viewH() * sc);
}

/* ================= 面板 ================= */
let panelKind = null, selInv = null;
function openPanel(kind, title, html){ panelKind = kind; $('pTitle').textContent = title; $('pBody').innerHTML = html; $('panel').classList.remove('hidden'); }
function closePanel(){ panelKind = null; selInv = null; $('panel').classList.add('hidden'); }
function togglePanel(k){ if(panelKind === k) closePanel(); else if(k === 'bag') openBag(); }
$('pClose').onclick = closePanel;

function openBag(){
  S = stats();
  let eq = '';
  for(const s of SLOT_ORDER){
    const it = P.eq[s];
    eq += `<div class="cell ${selInv === 'e:' + s ? 'sel' : ''}" data-eq="${s}" style="border-color:${it ? QC[it.q] : '#3a3048'}">${it ? itemIcon(it) : ''}${it && it.enh ? `<span class="en">+${it.enh}</span>` : ''}${!it ? `<span class="lab">${SLOTS[s]}</span>` : ''}</div>`;
  }
  let inv = '';
  for(let i = 0; i < INV_MAX; i++){
    const it = P.inv[i];
    const up = it && canEquip(it) && itemPower(it) > itemPower(P.eq[it.slot]);
    inv += `<div class="cell ${selInv === i ? 'sel' : ''}" ${it ? `data-inv="${i}"` : ''} style="border-color:${it ? QC[it.q] : '#3a3048'}">${it ? itemIcon(it) : ''}${it && it.enh ? `<span class="en">+${it.enh}</span>` : ''}${up ? '<span class="up">▲</span>' : ''}</div>`;
  }
  let det = '<span style="color:#999">點選裝備查看詳情</span>';
  if(typeof selInv === 'number' && P.inv[selInv]){
    const it = P.inv[selInv];
    det = itemHTML(it) + `<div style="margin-top:6px"><button class="btn g" data-act="equip" data-i="${selInv}" ${canEquip(it) ? '' : 'disabled'}>裝備</button><button class="btn r" data-act="sell" data-i="${selInv}">出售</button></div>`;
    const cur = P.eq[it.slot]; if(cur) det += `<div style="margin-top:6px;border-top:1px dashed #555;padding-top:4px;color:#aaa">目前裝備：</div>` + itemHTML(cur);
  } else if(typeof selInv === 'string' && P.eq[selInv.slice(2)]){
    const it = P.eq[selInv.slice(2)];
    det = itemHTML(it) + `<div style="margin-top:6px"><button class="btn" data-act="unequip" data-s="${it.slot}">卸下</button></div>`;
  }
  const html = `<div class="bag">
    <div class="eqcol">
      <div style="color:#ffe9a8;font-weight:bold">${esc(P.name)} · ${CLASSES[P.cls].name} · Lv.${P.lv}</div>
      <div class="eqslots">${eq}</div>
      <div class="stats">
        <div>生命 <b>${S.maxHp}</b></div><div>魔力 <b>${S.maxMp}</b></div>
        <div>攻擊 <b>${S.atk}</b></div><div>防禦 <b>${S.def}</b></div>
        <div>暴擊 <b>${S.crit}%</b></div><div>移速 <b>+${S.spdP}%</b></div>
        <div>戰力 <b style="color:#ff9f6a">${power(S)}</b></div><div>擊殺 <b>${P.kills}</b></div>
      </div>
      <div style="margin-top:6px">💰 金幣 ${P.gold}　🧪紅 ${P.hpPot}　🧪藍 ${P.mpPot}</div>
    </div>
    <div class="invcol">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px"><span>背包 ${P.inv.length}/${INV_MAX}</span>
        <span><button class="btn g" data-act="autoeq">一鍵換裝</button><button class="btn r" data-act="sellq" data-q="1">賣出普通/優秀</button></span></div>
      <div class="grid">${inv}</div>
      <div id="detail">${det}</div>
    </div></div>`;
  openPanel('bag', '🎒 背包與角色', html);
}
function openNpc(id){
  if(id === 'elder') openElder();
  else if(id === 'shop') openShop();
  else if(id === 'smith') openSmith();
  else if(id === 'tele') openTele();
}
function openElder(){
  const q = QUESTS[P.quest.i];
  let h;
  if(!q) h = `<div class="npcsay">老莫：「了不起的英雄啊！你已拯救了整片大陸，晨曦村永遠歡迎你。」</div>`;
  else {
    const rw = `獎勵：💰${q.gold} 金幣、✨${q.exp} 經驗${q.item ? `、${QN[q.item.q]}${SLOTS[q.item.slot]}` : ''}`;
    if(!P.quest.acc) h = `<div class="npcsay">老莫：「年輕人，來得正好！」<br>${q.d}</div><div><b style="color:#ffe066">【${q.t}】</b><br>${rw}</div><button class="btn g" data-act="qaccept">接受任務</button>`;
    else if(P.quest.c >= q.n) h = `<div class="npcsay">老莫：「做得太好了！這是你應得的獎勵。」</div><div>${rw}</div><button class="btn g" data-act="qdone">領取獎勵</button>`;
    else h = `<div class="npcsay">老莫：「${q.d}」</div><div>進度：${MT[q.m].name} ${P.quest.c}/${q.n}</div><div style="color:#aaa;margin-top:6px">提示：開啟「自動掛機」可以輕鬆打怪喔！</div>`;
  }
  openPanel('elder', '👴 村長·老莫', h);
}
function openShop(){
  const h = `<div class="npcsay">小鈴：「歡迎光臨～冒險必備的藥水都在這裡喔！」</div>
    <div class="row"><span>🧪 紅藥水（回復 35% 生命）　持有 ${P.hpPot}</span><span><button class="btn" data-act="buy" data-k="hp" data-n="1">20金</button><button class="btn" data-act="buy" data-k="hp" data-n="10">x10 180金</button></span></div>
    <div class="row"><span>🧪 藍藥水（回復 40% 魔力）　持有 ${P.mpPot}</span><span><button class="btn" data-act="buy" data-k="mp" data-n="1">15金</button><button class="btn" data-act="buy" data-k="mp" data-n="10">x10 130金</button></span></div>
    <div class="row"><span>出售背包中 普通/優秀 品質（未強化）裝備</span><button class="btn r" data-act="sellq" data-q="1">一鍵出售</button></div>
    <div class="row"><span>出售背包中 精良 以下品質（未強化）裝備</span><button class="btn r" data-act="sellq" data-q="2">一鍵出售</button></div>
    <div style="margin-top:8px">💰 目前金幣：<b style="color:#ffd76a">${P.gold}</b></div>`;
  openPanel('shop', '🛒 雜貨商·小鈴', h);
}
function enhCost(it){ return Math.round((it.lv * 12 + 40) * (it.enh + 1) * (1 + it.q * 0.3)); }
function enhRate(it){ return [100, 100, 100, 85, 75, 65, 55, 45, 35, 25][it.enh] || 0; }
function openSmith(){
  let h = `<div class="npcsay">阿鋼：「想讓裝備更強？交給我！每次強化 +10% 基礎屬性，失敗只會損失金幣。」</div>`;
  for(const s of SLOT_ORDER){
    const it = P.eq[s];
    if(!it){ h += `<div class="row"><span style="color:#777">${SLOTS[s]}：未裝備</span></div>`; continue; }
    const max = it.enh >= 10;
    h += `<div class="row"><span><span style="color:${QC[it.q]}">${itemIcon(it)} ${esc(itemName(it))}</span><br><small style="color:#aaa">${max ? '已達最高強化 +10' : `成功率 ${enhRate(it)}%　費用 ${enhCost(it)} 金`}</small></span>
      <button class="btn" data-act="enh" data-s="${s}" ${max ? 'disabled' : ''}>強化</button></div>`;
  }
  h += `<div style="margin-top:8px">💰 目前金幣：<b style="color:#ffd76a">${P.gold}</b></div>`;
  openPanel('smith', '🔨 鐵匠·阿鋼', h);
}
function openTele(){
  let h = `<div class="npcsay">星語：「星辰指引方向～想去哪裡呢？」</div>`;
  const list = [['forest', 1, 3, 20, '新手練功'], ['cave', 10, 3, 15, '洞窟·蛛后'], ['lava', 18, 3, 18, '魔域·炎魔君主']];
  for(const [id, lv, tx, ty, tip] of list){
    const cost = lv * 5;
    h += `<div class="row"><span><b>${MAPS[id].name}</b>（建議 Lv${lv}+，${tip}）</span><button class="btn" data-act="tele" data-m="${id}" data-x="${tx}" data-y="${ty}" data-c="${cost}">${cost ? cost + ' 金' : '免費'}</button></div>`;
  }
  openPanel('tele', '✨ 傳送師·星語', h);
}
$('panel').addEventListener('click', e => {
  const cell = e.target.closest('.cell');
  if(cell && panelKind === 'bag'){
    if(cell.dataset.inv != null){ const i = +cell.dataset.inv; selInv = selInv === i ? null : i; openBag(); return; }
    if(cell.dataset.eq){ selInv = 'e:' + cell.dataset.eq; openBag(); return; }
  }
  const b = e.target.closest('[data-act]'); if(!b) return;
  const a = b.dataset.act;
  if(a === 'equip'){ equip(+b.dataset.i); selInv = null; openBag(); }
  else if(a === 'sell'){ sellItem(+b.dataset.i); selInv = null; openBag(); }
  else if(a === 'unequip'){ unequip(b.dataset.s); selInv = null; openBag(); }
  else if(a === 'autoeq'){ autoEquip(); selInv = null; openBag(); }
  else if(a === 'sellq'){ sellBelow(+b.dataset.q); selInv = null; panelKind === 'bag' ? openBag() : openShop(); }
  else if(a === 'buy'){
    const n = +b.dataset.n, k = b.dataset.k, cost = k === 'hp' ? (n === 10 ? 180 : 20) : (n === 10 ? 130 : 15);
    if(P.gold < cost){ msg('金幣不足！', '#ff8a8a'); return; }
    P.gold -= cost; if(k === 'hp') P.hpPot += n; else P.mpPot += n; msg(`購買了 ${n} 瓶${k === 'hp' ? '紅' : '藍'}藥水`, '#ffd76a'); save(); openShop();
  }
  else if(a === 'enh'){
    const it = P.eq[b.dataset.s]; if(!it) return; const cost = enhCost(it);
    if(P.gold < cost){ msg('金幣不足！', '#ff8a8a'); return; }
    P.gold -= cost;
    if(Math.random() * 100 < enhRate(it)){ it.enh++; it.price = Math.round(it.price * 1.15); msg(`強化成功！${itemName(it)}`, '#7dff8a'); toast('強化成功！'); ring(P.x, P.y, 60, '#ffe066', 0.5); }
    else { msg('強化失敗……裝備安然無恙', '#ff8a8a'); }
    afterEquip(); openSmith();
  }
  else if(a === 'tele'){
    const c = +b.dataset.c; if(P.gold < c){ msg('金幣不足！', '#ff8a8a'); return; }
    P.gold -= c; closePanel(); loadMap(b.dataset.m, +b.dataset.x, +b.dataset.y);
  }
  else if(a === 'qaccept'){ P.quest.acc = true; P.quest.c = 0; msg(`接受任務【${QUESTS[P.quest.i].t}】`, '#ffe066'); save(); openElder(); }
  else if(a === 'qdone'){
    const q = QUESTS[P.quest.i];
    P.gold += q.gold; gainExp(q.exp);
    if(q.item){ const it = genItem(q.item.slot, q.item.lv, q.item.q); if(P.inv.length < INV_MAX){ P.inv.push(it); msg(`獲得任務獎勵：${it.name}`, QC[it.q]); } else { P.gold += it.price; msg('背包已滿，獎勵裝備已轉為金幣', '#ffd76a'); } }
    msg(`完成任務【${q.t}】！獲得 ${q.gold} 金幣、${q.exp} 經驗`, '#7dff8a');
    P.quest = {i:P.quest.i + 1, c:0, acc:false}; save(); openElder();
  }
});

/* ================= 輸入 ================= */
addEventListener('keydown', e => {
  if(e.target.tagName === 'INPUT') return;
  const k = e.key.toLowerCase(); keys[k] = true;
  if(['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].includes(k)) e.preventDefault();
  if(!running || !P) return;
  if(e.repeat) return;
  if(k === '1' || k === '2' || k === '3') useSkill(+k - 1);
  else if(k === 'q') usePot('hp');
  else if(k === 'e') usePot('mp');
  else if(k === 'b' || k === 'i') togglePanel('bag');
  else if(k === 'z') toggleAuto();
  else if(k === 't') goTown();
  else if(k === 'escape') closePanel();
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
addEventListener('blur', () => { for(const k in keys) keys[k] = false; });
let dragMove = false, pDown = false;
function toWorld(e){ const r = cv.getBoundingClientRect(); return {x:(e.clientX - r.left) / ZOOM + cam.x, y:(e.clientY - r.top) / ZOOM + cam.y}; }
cv.addEventListener('pointerdown', e => {
  if(!running || P.dead) return;
  pDown = true; dragMove = false;
  try{ cv.setPointerCapture(e.pointerId); }catch(_){}
  const w = toWorld(e); P.manualT = 2.5;
  let best = null, bd = 1e9;
  for(const m of monsters){ if(m.dead) continue; const d = Math.hypot(m.x - w.x, (m.y - m.d.h * 0.45) - w.y); if(d < m.d.h * 0.5 + 16 && d < bd){ bd = d; best = m; } }
  if(best && !map.safe){ P.target = best; P.moveTo = null; P.npcT = null; return; }
  for(const n of npcs){ if(Math.hypot(n.x - w.x, (n.y - 28) - w.y) < 34){ P.npcT = n; P.target = null; P.moveTo = null; return; } }
  P.target = null; P.npcT = null; P.moveTo = w; P.autoWander = false; dragMove = true;
});
cv.addEventListener('pointermove', e => { if(pDown && dragMove && running && !P.dead){ P.moveTo = toWorld(e); P.manualT = 2.5; } });
const endPtr = () => { pDown = false; dragMove = false; };
cv.addEventListener('pointerup', endPtr); cv.addEventListener('pointercancel', endPtr);
cv.addEventListener('contextmenu', e => e.preventDefault());
$('bAuto').onclick = () => toggleAuto();
$('bBag').onclick = () => togglePanel('bag');
$('bTown').onclick = () => goTown();
$('bRevive').onclick = () => revive();

/* ================= 存檔 ================= */
function save(){
  if(!P) return;
  const keep = ['name', 'cls', 'lv', 'exp', 'gold', 'hpPot', 'mpPot', 'inv', 'eq', 'quest', 'map', 'x', 'y', 'hp', 'mp', 'auto', 'kills'];
  const d = {}; for(const k of keep) d[k] = P[k];
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(d)); }catch(_){}
}
function loadSave(){
  try{ const s = localStorage.getItem(SAVE_KEY); if(!s) return null; const d = JSON.parse(s); if(!d || !CLASSES[d.cls]) return null; return d; }catch(_){ return null; }
}

/* ================= 開始畫面 ================= */
let selCls = 'sword';
const cardCtx = {};
function buildCards(){
  let h = '';
  for(const k in CLASSES){ const C = CLASSES[k]; h += `<div class="card ${k === selCls ? 'sel' : ''}" data-c="${k}"><canvas width="240" height="240"></canvas><h3>${C.name}</h3><p>${C.desc}</p></div>`; }
  $('cards').innerHTML = h;
  $('cards').querySelectorAll('.card').forEach(el => {
    cardCtx[el.dataset.c] = el.querySelector('canvas').getContext('2d');
    el.onclick = () => { selCls = el.dataset.c; $('cards').querySelectorAll('.card').forEach(x => x.classList.toggle('sel', x.dataset.c === selCls)); };
  });
}
function drawCards(){
  for(const k in cardCtx){
    const c = cardCtx[k]; c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, 240, 240);
    const sel = k === selCls;
    c.fillStyle = sel ? 'rgba(255,215,106,.15)' : 'rgba(255,255,255,.04)'; c.beginPath(); c.arc(120, 140, 90, 0, PI2); c.fill();
    const cyc = (gt * 0.7) % 3;
    const atk = sel && cyc < 0.25 ? 1 - cyc / 0.25 : 0;
    drawChibi(c, 120, 205, {...CLASSES[k].look, style:k, weapon:CLASSES[k].weapon, scale:3, face:1, time:gt, walk:gt * 10, moving:sel && cyc > 1.5, atk});
  }
}
function startGame(d){
  P = d; initRuntime(P);
  S = stats();
  if(!P.hp || P.hp <= 0) P.hp = S.maxHp; if(P.mp == null) P.mp = S.maxMp;
  P.hp = Math.min(P.hp, S.maxHp); P.mp = Math.min(P.mp, S.maxMp);
  $('start').classList.add('hidden'); $('ui').classList.remove('hidden');
  running = true;
  const m = MAPS[P.map] ? P.map : 'village';
  loadMap(m, null, null, true);
  if(Math.hypot(P.x, P.y) < 1 || P.x > map.w * TILE || P.y > map.h * TILE){ P.x = 16 * TILE; P.y = 13 * TILE; }
  moveEnt(P, 0, 0); snapCam();
  buildSkillbar(); drawPortrait(); updateHUD();
  toast(map.name);
  msg(`歡迎來到 Q萌英雄傳，${P.name}！`, '#ffe066');
  if(P.quest.i === 0 && !P.quest.acc) msg('先去找頭上有「!」的村長·老莫接任務吧！', '#9fe');
}
$('bStart').onclick = () => {
  let name = $('nameIn').value.trim() || ['小萌', '阿呆', '豆豆', '糖糖', '布丁'][randi(0, 4)] + CLASSES[selCls].name;
  if(loadSave() && !confirm('建立新角色會覆蓋現有存檔，確定嗎？')) return;
  const p = newPlayer(name, selCls);
  startGame(p); save();
};
$('bCont').onclick = () => { const d = loadSave(); if(d) startGame(d); };
buildCards();
{ const d = loadSave(); if(d){ $('bCont').classList.remove('hidden'); $('bCont').textContent = `繼續遊戲（${d.name} Lv${d.lv}）`; } }

/* ================= 主迴圈 ================= */
let last = performance.now();
function loop(now){
  const dt = Math.min(0.05, (now - last) / 1000); last = now; gt += dt;
  if(running){
    update(dt); render();
    hudT -= dt; if(hudT <= 0){ hudT = 0.07; updateHUD(); }
  } else drawCards();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
addEventListener('beforeunload', save);
document.addEventListener('visibilitychange', () => { if(document.hidden) save(); });
// 測試用掛鉤
window.__game = {get P(){ return P; }, get monsters(){ return monsters; }, loadMap:(id, x, y) => loadMap(id, x, y), gainExp, useSkill, toggleAuto};
</script>
